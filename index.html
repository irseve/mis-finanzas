<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis finanzas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
// Temas: cada uno con versión clara y oscura. Regla fija en todos: gastos en rojo (--spend) e ingresos en verde (--income).
window.THEMES = {
  clasico:  { name:"Bosque", L:{bg:"#EDF2EF",surface:"#FFFFFF",surface2:"#F5F8F6",ink:"#17251F",muted:"#5E6E67",line:"#D5DFDA",brand:"#1F6F5C",brandInk:"#FFFFFF",spend:"#C93636",onSpend:"#FFFFFF",income:"#1E7A3C",onIncome:"#FFFFFF",warn:"#B4541A",track:"#E1E9E5"},
                                D:{bg:"#101815",surface:"#18231F",surface2:"#1E2B26",ink:"#E6EEEA",muted:"#98A8A1",line:"#2B3A34",brand:"#4FB597",brandInk:"#0D1714",spend:"#F07575",onSpend:"#1A0B0B",income:"#5CC77E",onIncome:"#0B1A10",warn:"#E59A62",track:"#26342E"} },
  esmeralda:{ name:"Esmeralda", L:{bg:"#EEF6F2",surface:"#FFFFFF",surface2:"#F4FAF7",ink:"#10231B",muted:"#58706A",line:"#D3E4DC",brand:"#0E9F6E",brandInk:"#FFFFFF",spend:"#DC2F3C",onSpend:"#FFFFFF",income:"#15803D",onIncome:"#FFFFFF",warn:"#E07A1F",track:"#DCEBE4"},
                                D:{bg:"#0B1612",surface:"#13221C",surface2:"#1A2B24",ink:"#E4F1EB",muted:"#93ACA3",line:"#22362E",brand:"#34D399",brandInk:"#06140F",spend:"#F87171",onSpend:"#1A0808",income:"#4ADE80",onIncome:"#06140B",warn:"#F59E4B",track:"#1D2F28"} },
  oceano:   { name:"Océano", L:{bg:"#EEF3FB",surface:"#FFFFFF",surface2:"#F5F8FD",ink:"#0F1B2E",muted:"#5A6880",line:"#D4DEEE",brand:"#1769F0",brandInk:"#FFFFFF",spend:"#DC2F3C",onSpend:"#FFFFFF",income:"#0F7F4D",onIncome:"#FFFFFF",warn:"#C2850A",track:"#DCE5F4"},
                                D:{bg:"#0A111D",surface:"#121C2C",surface2:"#18243A",ink:"#E3ECFA",muted:"#93A3BD",line:"#22314A",brand:"#5B9BFF",brandInk:"#07101F",spend:"#F87171",onSpend:"#1A0808",income:"#3DD39A",onIncome:"#04150D",warn:"#FBBF24",track:"#1B2840"} },
  mandarina:{ name:"Mandarina", L:{bg:"#FBF3EE",surface:"#FFFFFF",surface2:"#FDF8F5",ink:"#2A1810",muted:"#7A6257",line:"#EEDDD3",brand:"#E2531A",brandInk:"#FFFFFF",spend:"#C8102E",onSpend:"#FFFFFF",income:"#13784F",onIncome:"#FFFFFF",warn:"#B45309",track:"#F3E4DA"},
                                D:{bg:"#170F0B",surface:"#231711",surface2:"#2C1E17",ink:"#F8E9E1",muted:"#B79C8F",line:"#3A2A21",brand:"#FF8A4C",brandInk:"#1C0E07",spend:"#FF6B6B",onSpend:"#1C0707",income:"#34D399",onIncome:"#04150D",warn:"#FBBF24",track:"#33231B"} },
  ciruela:  { name:"Ciruela", L:{bg:"#F4F1FA",surface:"#FFFFFF",surface2:"#F8F6FC",ink:"#1C1530",muted:"#675F80",line:"#E0D9EE",brand:"#6D28D9",brandInk:"#FFFFFF",spend:"#D92D3A",onSpend:"#FFFFFF",income:"#15803D",onIncome:"#FFFFFF",warn:"#B45309",track:"#E8E2F4"},
                                D:{bg:"#110D1B",surface:"#1B1529",surface2:"#221B33",ink:"#EEE8FA",muted:"#A69CC0",line:"#2E2545",brand:"#A78BFA",brandInk:"#120B22",spend:"#F87171",onSpend:"#1A0808",income:"#4ADE80",onIncome:"#06140B",warn:"#FBBF24",track:"#272038"} },
};
(() => {
  const vars = (t, dark) => `--bg:${t.bg};--surface:${t.surface};--surface-2:${t.surface2};--ink:${t.ink};--muted:${t.muted};--line:${t.line};--brand:${t.brand};--brand-ink:${t.brandInk};--spend:${t.spend};--on-spend:${t.onSpend};--income:${t.income};--on-income:${t.onIncome};--warn:${t.warn};--track:${t.track};--shadow:${dark ? "none" : "0 1px 0 rgba(0,0,0,.06)"};color-scheme:${dark ? "dark" : "light"};`;
  let css = "";
  for (const [k, t] of Object.entries(THEMES)) {
    const sel = k === "clasico" ? ":root" : `:root[data-palette="${k}"]`;
    css += `${sel}{${vars(t.L)}}@media (prefers-color-scheme:dark){${sel}:not([data-theme="light"]){${vars(t.D, true)}}}${sel}[data-theme="dark"]{${vars(t.D, true)}}`;
  }
  const st = document.createElement("style"); st.id = "themeCss"; st.textContent = css; document.head.appendChild(st);
  const get = k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
  window.applyTheme = (palette, mode) => {
    palette = THEMES[palette] ? palette : "clasico"; mode = mode === "light" || mode === "dark" ? mode : "auto";
    const r = document.documentElement;
    if (palette === "clasico") r.removeAttribute("data-palette"); else r.setAttribute("data-palette", palette);
    if (mode === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", mode);
    // Color de la barra de estado del iPhone según el tema
    document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove());
    const add = (c, media) => { const m = document.createElement("meta"); m.name = "theme-color"; m.content = c; if (media) m.media = media; document.head.appendChild(m); };
    const t = THEMES[palette];
    if (mode === "auto") { add(t.L.bg, "(prefers-color-scheme: light)"); add(t.D.bg, "(prefers-color-scheme: dark)"); } else add(mode === "dark" ? t.D.bg : t.L.bg);
    try { localStorage.setItem("finanzas.palette", palette); localStorage.setItem("finanzas.mode", mode); } catch {}
  };
  applyTheme(get("finanzas.palette"), get("finanzas.mode"));
})();
</script>
<style>
:root{
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--income)} .dot.off{background:var(--warn)}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.month button:hover{background:var(--surface-2);color:var(--ink)}
.month span{min-width:140px;text-align:center;font-weight:600;text-transform:capitalize}
nav.tabs{display:flex;gap:4px;margin-bottom:18px}
nav.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--bg)}
nav.tabs svg{display:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:720px){
  .wrap{padding-bottom:140px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;padding:10px 4px 8px;border-radius:12px}
  nav.tabs svg{display:block}
  .month span{min-width:118px;font-size:.95rem}
}
.banner{background:var(--surface);border:1px solid var(--warn);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
@media (max-width:820px){.g2{grid-template-columns:1fr}}
h2{font-size:1rem;margin:0 0 12px;font-weight:700}
.sub{color:var(--muted);font-size:.85rem}

/* Hero */
.hero{padding:22px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.spent{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-size:1.1rem}
.strip{display:flex;height:34px;border-radius:9px;overflow:hidden;margin:20px 0 10px;background:var(--track)}
.strip i{display:block;height:100%;min-width:2px;transition:flex-grow .4s ease}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}

/* category rows */
.crow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.crow .vals{text-align:right}
.bar{grid-column:1/-1;height:6px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px}
.over{color:var(--warn);font-weight:600}

svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart{width:100%;height:auto;display:block}

/* lists */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.toolbar input{flex:1 1 180px}
.day{font-size:.8rem;color:var(--muted);font-weight:600;margin:16px 4px 6px;text-transform:capitalize}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:6px;cursor:pointer}
.tx:hover{border-color:var(--muted)}
.tx .ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.85rem}
.tx .mid{flex:1;min-width:0}
.tx .mid div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700}
.amt.gasto{color:var(--spend)} .amt.ingreso{color:var(--income)}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:6px;font-weight:500}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty button{margin-top:12px}

.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:21;width:58px;height:58px;border-radius:18px;border:0;background:var(--spend);color:var(--on-spend);font-size:2rem;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
@media (max-width:720px){.fab{bottom:calc(102px + env(safe-area-inset-bottom,0px))}}

.fixed-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.fixed-row:first-child{border-top:0}
.fixed-row .mid{flex:1;min-width:150px}
.pill{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--income) 16%,transparent);color:var(--income)}
.pill.pend{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}

/* modal */
dialog{border:0;border-radius:18px;padding:0;width:min(460px,calc(100% - 24px));background:var(--surface);color:var(--ink);max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(10,20,16,.45)}
.mhead{padding:18px 20px 0;font-weight:800;font-size:1.1rem}
.mbody{padding:14px 20px;display:grid;gap:12px}
.mfoot{padding:0 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mfoot .spacer{flex:1}
label.f{display:grid;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
label.f input,label.f select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-weight:500;font-size:1rem;width:100%}
.big input{font-size:1.6rem!important;font-weight:800!important}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:8px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.scrollx{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:min(380px,100%);display:grid;gap:12px}
.login h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.02em}
.login .err{color:var(--warn);font-size:.9rem;min-height:1.2em}
.update-bar{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:60;max-width:460px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;box-shadow:0 6px 18px rgba(0,0,0,.2);font-size:.92rem;font-weight:600}
.update-bar span{flex:1}
.update-bar button{border:0;border-radius:10px;min-height:44px;cursor:pointer;font-weight:700}
.update-bar .go{background:var(--brand);color:var(--brand-ink);padding:0 16px}
.update-bar .x{background:transparent;color:inherit;min-width:44px;font-size:1.2rem;opacity:.7}
.rowbtns{display:flex;gap:6px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.pendbtn{margin-left:auto;border:0;border-radius:999px;background:var(--warn);color:#fff;font-weight:700;min-height:40px;padding:0 14px;cursor:pointer}
.pendbtn b{display:inline-block;min-width:20px;margin-left:4px;background:rgba(255,255,255,.25);border-radius:999px;padding:1px 6px}
.pendcard{display:grid;gap:4px;text-align:left;width:100%;cursor:pointer;border-color:var(--warn);color:var(--ink);font:inherit}
.quick{display:flex;gap:8px}
.btn.inc{background:var(--income);color:var(--on-income)}
.btn.spend{background:var(--spend);color:var(--on-spend)}
.seg button[data-type="gasto"][aria-pressed="true"]{background:var(--spend);color:var(--on-spend)}
.seg button[data-type="ingreso"][aria-pressed="true"]{background:var(--income);color:var(--on-income)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.themes button{display:grid;gap:8px;text-align:left;border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;min-height:44px}
.themes button[aria-pressed="true"]{border-color:var(--ink)}
.themes .chips{display:flex;gap:4px}
.themes .chips i{width:22px;height:22px;border-radius:7px;display:block}
.themes b{font-size:.92rem}
.expect{margin-top:16px}
.strip.two{margin:0 0 10px;height:22px}
.strip i.todo,.sw.todo{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--spend) 45%,transparent) 0 5px,color-mix(in srgb,var(--spend) 18%,transparent) 5px 10px)}
.after{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.92rem}
.suggest{padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.9rem;margin-bottom:6px}
.suggest details{margin-top:6px}
.suggest summary{cursor:pointer;color:var(--brand);font-weight:600;min-height:32px;display:flex;align-items:center}
.cash{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.ftotals{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0 6px}
.ftotals div{display:flex;flex-direction:column}
.ftotals b{font-size:1.15rem}
.fgroup{margin-top:14px}
.fghead{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:4px;border-bottom:1px solid var(--line)}
.amt.retiro{color:var(--muted)} .amt.ahorro{color:var(--brand)}
.inline-new{display:flex;gap:8px;flex-wrap:wrap;margin-top:-4px}
.inline-new input{flex:1 1 160px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:1rem}
.warnbox{border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem}
.fijobox{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:12px}
.check input{width:22px;height:22px}
@media (max-width:720px){.btn.sm{min-height:40px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <div class="card">
    <h1>Mis finanzas</h1>
    <label class="f">Correo<input id="email" type="email" autocomplete="email" inputmode="email"></label>
    <label class="f">Contraseña<input id="password" type="password" autocomplete="current-password"></label>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn" id="signin">Iniciar sesión</button>
    <button class="btn ghost" id="signup">Crear cuenta</button>
  </div>
</div>
<div id="app" hidden>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">Mis finanzas</div>
      <div class="sync" id="sync"><span class="dot"></span><span>Conectando…</span></div>
    </div>
    <button class="pendbtn" id="pendBtn" hidden>Pendientes <b>0</b></button>
    <div class="month" role="group" aria-label="Mes">
      <button id="prevM" aria-label="Mes anterior">‹</button>
      <span id="monthLabel"></span>
      <button id="nextM" aria-label="Mes siguiente">›</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="resumen" aria-current="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Resumen</button>
    <button data-tab="movs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>Movimientos</button>
    <button data-tab="fijos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Fijos</button>
    <button data-tab="cats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
  </nav>

<script>
(() => {
"use strict";
// ---------- versión ----------
// Al subir cambios: actualiza APP_VERSION, APP_DATE, version.json y el ?v= de config.js.
const APP_VERSION = "1.6.0";
const APP_DATE = "2026-10-30";

// ---------- utilities ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => crypto.randomUUID();
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const ymOf = iso => iso.slice(0, 7);
const ymAdd = (ym, n) => { let [y, m] = ym.split("-").map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };
const daysIn = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const monthName = (ym, opts = {month:"long", year:"numeric"}) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m-1, 1).toLocaleDateString("es-MX", opts); };
const dayName = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("es-MX", {weekday:"long", day:"numeric", month:"long"}); };
let toastT;
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); };

const PALETTE = ["#1F6F5C","#8A3B6E","#C2761B","#2F5D9E","#B23A48","#5B8C2A","#7A5BB0","#2B8A8A","#A0682F","#5E6E67","#D08C9E","#3E7CB1"];
const DEFAULT_CATS = [
  ["Vivienda","gasto","#2F5D9E"],["Comida","gasto","#C2761B"],["Transporte","gasto","#2B8A8A"],
  ["Servicios","gasto","#7A5BB0"],["Salud","gasto","#B23A48"],["Entretenimiento","gasto","#8A3B6E"],
  ["Ropa","gasto","#D08C9E"],["Educación","gasto","#3E7CB1"],["Otros","gasto","#5E6E67"],
  ["Salario","ingreso","#5B8C2A"],["Otros ingresos","ingreso","#1F6F5C"],
];
const DEFAULT_METHODS = [["Efectivo","efectivo","#5B8C2A"],["Transferencia","transferencia","#2F5D9E"],["SPAY","spay","#7A5BB0"]];
const CURRENCIES = ["MXN","USD","EUR","COP","ARS","CLP","PEN","GTQ","CRC","DOP"];

// ---------- state ----------
const S = { tab:"resumen", ym: ymOf(todayISO()), currency:"MXN", categories:[], methods:[], recs:[], pending:[], goals:[], goalSaved:{}, tx:[], filterCat:"", filterMethod:"", search:"", ready:false, needsMigration:false };
const fmt = (n, compact) => {
  try { return new Intl.NumberFormat("es-MX", {style:"currency", currency:S.currency || "MXN", maximumFractionDigits: compact ? 0 : 2, minimumFractionDigits: compact ? 0 : 2}).format(n || 0); }
  catch { return "$" + (n || 0).toFixed(2); }
};
const cat = id => S.categories.find(c => c.id === id) || {id, name:"Sin categoría", color:"#8C9A94", kind:"gasto", budget:0};
const catsOf = kind => S.categories.filter(c => c.kind === kind);
const method = id => S.methods.find(m => m.id === id);
const goal = id => S.goals.find(g => g.id === id);
const isSalaryCat = id => /salario|sueldo|n[oó]mina/i.test(cat(id).name);
const lastMethodKey = "finanzas.lastMethod";
const lastMethod = () => { try { return localStorage.getItem(lastMethodKey) || ""; } catch { return ""; } };
const rememberMethod = id => { try { if (id) localStorage.setItem(lastMethodKey, id); } catch {} };

// ---------- calendario de fijos ----------
// Mismo cálculo que public.recurrence_on_or_after en la base de datos.
const isoAdd = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m-1, d+n)).toISOString().slice(0, 10); };
const isoDiff = (a, b) => { const p = s => s.split("-").map(Number), [y1,m1,d1] = p(a), [y2,m2,d2] = p(b); return Math.round((Date.UTC(y1,m1-1,d1) - Date.UTC(y2,m2-1,d2)) / 864e5); };
const FREQS = { diario:"Diario", semanal:"Semanal", quincenal:"Quincenal", mensual:"Mensual", salario:"Quincena de salario" };
function occOnOrAfter(r, from) {
  const d = from > r.start ? from : r.start;
  if (r.freq === "diario") return d;
  if (r.freq === "semanal" || r.freq === "quincenal") { const st = r.freq === "semanal" ? 7 : 15; return isoAdd(r.start, st * Math.ceil(isoDiff(d, r.start) / st)); }
  const ym = ymOf(d), last = `${ym}-${pad(daysIn(ym))}`;
  if (r.freq === "salario") return d <= `${ym}-15` ? `${ym}-15` : d <= last ? last : `${ymAdd(ym, 1)}-15`;
  let c;
  for (let i = 0, m = ym; i < 2; i++, m = ymAdd(m, 1)) { c = `${m}-${pad(Math.min(r.day || +r.start.slice(8), daysIn(m)))}`; if (c >= d) return c; }
  return c;
}
function occInMonth(r, ym) {
  const out = [], end = `${ym}-${pad(daysIn(ym))}`;
  for (let d = occOnOrAfter(r, ym + "-01"); d <= end && out.length < 40; d = occOnOrAfter(r, isoAdd(d, 1))) out.push(d);
  return out;
}
const freqText = r => {
  const dm = s => `${+s.slice(8)}/${s.slice(5,7)}`;
  return { diario:"Todos los días", semanal:`Cada semana desde ${dm(r.start)}`, quincenal:`Cada 15 días desde ${dm(r.start)}`,
    mensual:`El día ${r.day || +r.start.slice(8)} de cada mes`, salario:"Día 15 y último día de cada mes" }[r.freq];
};

// ---------- Supabase ----------
const configured = window.SUPABASE_URL && !/PEGA_AQUI/.test(window.SUPABASE_URL) && window.SUPABASE_KEY && !/PEGA_AQUI/.test(window.SUPABASE_KEY);
const sb = configured ? supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } }) : null;
let userId = null, channel = null;

const toTx = r => ({ id:r.id, type:r.type, amount:+r.amount, categoryId:r.category_id, date:r.date, note:r.note || "", fixedId:r.fixed_id, methodId:r.payment_method_id, recurrenceId:r.recurrence_id, dueDate:r.due_date, goalId:r.goal_id, created:r.created_at });
const txDb = t => ({ id:t.id, type:t.type, amount:t.amount, category_id:t.categoryId || null, date:t.date, note:t.note || "", fixed_id:t.fixedId || null, payment_method_id:t.methodId || null, recurrence_id:t.recurrenceId || null, due_date:t.dueDate || null, goal_id:t.goalId || null });
const toRec = r => ({ id:r.id, name:r.name, type:r.type, amount:+r.amount, original:+r.original_amount, categoryId:r.category_id, methodId:r.payment_method_id, freq:r.freq, start:r.start_date, day:r.day, mode:r.mode, next:r.next_date, active:r.active });
const recDb = r => ({ id:r.id, name:r.name, type:r.type, amount:r.amount, original_amount:r.original ?? r.amount, category_id:r.categoryId || null, payment_method_id:r.methodId || null, freq:r.freq, start_date:r.start, day:r.freq === "mensual" ? (r.day || +r.start.slice(8)) : null, mode:r.mode, next_date:r.next || null, active:r.active });
const toPend = r => ({ id:r.id, source:r.source, type:r.type, amount:+r.amount, categoryId:r.category_id, methodId:r.payment_method_id, date:r.date, note:r.note || "", recurrenceId:r.recurrence_id, status:r.status });
const toCat = r => ({ id:r.id, name:r.name, kind:r.kind, color:r.color, budget:+r.budget });
const toMethod = r => ({ id:r.id, name:r.name, kind:r.kind, color:r.color, active:r.active });
const toGoal = r => ({ id:r.id, name:r.name, target:+r.target_amount, targetDate:r.target_date, color:r.color, active:r.active });

function rangeFor(ym) { return [ymAdd(ym, -5) + "-01", ym + "-" + pad(daysIn(ym))]; }
const missingTable = e => e && (e.code === "42P01" || e.code === "PGRST205" || e.code === "42703" || /does not exist|could not find/i.test(e.message || ""));

async function check(p, okMsg) {
  const { error } = await p;
  if (error) { console.error(error); toast(navigator.onLine ? "No se pudo guardar: " + error.message : "Sin conexión. Intenta de nuevo cuando tengas señal."); setSync("off", "Error al guardar"); return false; }
  if (okMsg) toast(okMsg);
  return true;
}

let lastGen = 0;
async function loadBase() {
  if (Date.now() - lastGen > 5 * 60e3) { lastGen = Date.now(); await sb.rpc("generate_pending_entries"); } // crea pendientes de fijos cuya fecha ya llegó
  const [a] = rangeFor(S.ym);
  const [st, cs, pm, rc, pe, gl, sv] = await Promise.all([
    sb.from("settings").select("*").maybeSingle(),
    sb.from("categories").select("*").order("created_at"),
    sb.from("payment_methods").select("*").order("created_at"),
    sb.from("recurrences").select("*").order("created_at"),
    sb.from("pending_entries").select("*").neq("status", "aceptado").or(`status.eq.pendiente,date.gte.${a}`).order("date"),
    sb.from("goals").select("*").order("created_at"),
    sb.from("transactions").select("goal_id,amount").eq("type", "ahorro"),
  ]);
  if (cs.error) throw cs.error;
  S.needsMigration = [pm, rc, pe, gl, sv].some(r => missingTable(r.error));
  const err = [pm, rc, pe, gl, sv].find(r => r.error && !missingTable(r.error));
  if (err) throw err.error;
  S.currency = st.data?.currency || "MXN";
  S.categories = (cs.data || []).map(toCat);
  S.methods = (pm.data || []).map(toMethod);
  S.recs = (rc.data || []).map(toRec);
  S.pending = (pe.data || []).map(toPend);
  S.goals = (gl.data || []).map(toGoal);
  S.goalSaved = {};
  for (const r of sv.data || []) if (r.goal_id) S.goalSaved[r.goal_id] = (S.goalSaved[r.goal_id] || 0) + +r.amount;
  if (!S.categories.length) {
    const rows = DEFAULT_CATS.map(([name, kind, color], i) => ({ id: uid(), name, kind, color, budget: 0, created_at: new Date(Date.now() + i).toISOString() }));
    const { error } = await sb.from("categories").insert(rows);
    if (!error) S.categories = rows.map(toCat);
  }
  if (!S.methods.length && !S.needsMigration) {
    const rows = DEFAULT_METHODS.map(([name, kind, color], i) => ({ id: uid(), name, kind, color, active: true, created_at: new Date(Date.now() + i).toISOString() }));
    const { error } = await sb.from("payment_methods").insert(rows);
    if (!error) S.methods = rows.map(toMethod);
  }
}
async function loadTx() {
  const [a, b] = rangeFor(S.ym), want = S.ym;
  const { data, error } = await sb.from("transactions").select("*").gte("date", a).lte("date", b).order("date", { ascending:false }).limit(5000);
  if (error) throw error;
  if (want !== S.ym) return; // month changed meanwhile
  S.tx = data.map(toTx);
}
async function refresh(all = true) {
  try {
    if (all) await loadBase();
    await loadTx();
    S.ready = true;
    setSync("on", "Sincronizado");
  } catch (e) {
    console.error(e);
    setSync("off", navigator.onLine ? "Error al cargar" : "Sin conexión");
  }
  render();
}
let refreshT;
const refreshSoon = () => { clearTimeout(refreshT); refreshT = setTimeout(() => refresh(true), 300); };

function startRealtime() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("finanzas-" + userId);
  ["transactions","categories","settings","payment_methods","recurrences","pending_entries","goals"].forEach(table =>
    channel.on("postgres_changes", { event:"*", schema:"public", table, filter:`user_id=eq.${userId}` }, refreshSoon));
  channel.subscribe();
}

const Store = {
  saveTx: (t, msg) => check(sb.from("transactions").upsert(txDb(t)), msg).then(ok => (ok && refresh(t.type === "ahorro"), ok)),
  delTx: (id, msg) => check(sb.from("transactions").delete().eq("id", id), msg).then(ok => (ok && refresh(), ok)),
  saveRec: (r, msg) => check(sb.from("recurrences").upsert(recDb(r)), msg).then(ok => (ok && refresh(), ok)),
  delRec: async (id, msg) => {
    await sb.from("pending_entries").delete().eq("recurrence_id", id).eq("status", "pendiente");
    return check(sb.from("recurrences").delete().eq("id", id), msg).then(ok => (ok && refresh(), ok));
  },
  saveCat: (c, msg) => check(sb.from("categories").upsert({ id:c.id, name:c.name, kind:c.kind, color:c.color, budget:c.budget || 0 }), msg).then(ok => (ok && refresh(), ok)),
  delCat: (id, msg) => check(sb.from("categories").delete().eq("id", id), msg).then(ok => (ok && refresh(), ok)),
  saveMethod: (m, msg) => check(sb.from("payment_methods").upsert({ id:m.id, name:m.name, kind:m.kind, color:m.color, active:m.active }), msg).then(ok => (ok && refresh(), ok)),
  saveGoal: (g, msg) => check(sb.from("goals").upsert({ id:g.id, name:g.name, target_amount:g.target, target_date:g.targetDate || null, color:g.color, active:g.active }), msg).then(ok => (ok && refresh(), ok)),
  delGoal: (id, msg) => check(sb.from("goals").delete().eq("id", id), msg).then(ok => (ok && refresh(), ok)),
  saveCurrency: cur => { S.currency = cur; render(); return check(sb.from("settings").upsert({ user_id:userId, currency:cur }), "Moneda guardada"); },
  // Acepta un pendiente: crea el movimiento y, si cambió el monto de un fijo, lo guarda como sugerencia para la próxima vez.
  acceptPending: async (p, vals, msg = "Movimiento registrado") => {
    const t = { id: uid(), type: vals.type, amount: vals.amount, categoryId: vals.categoryId, methodId: vals.methodId, date: vals.date, note: vals.note, recurrenceId: p.recurrenceId, dueDate: p.recurrenceId ? p.date : null };
    if (!await check(sb.from("transactions").insert(txDb(t)))) return false;
    await check(sb.from("pending_entries").update({ status: "aceptado" }).eq("id", p.id));
    const r = S.recs.find(x => x.id === p.recurrenceId);
    if (r && r.amount !== t.amount) await check(sb.from("recurrences").update({ amount: t.amount }).eq("id", r.id));
    rememberMethod(t.methodId);
    toast(msg); refresh(); return true;
  },
  discardPending: p => check(sb.from("pending_entries").update({ status: "descartado" }).eq("id", p.id), "Pendiente descartado").then(ok => (ok && refresh(), ok)),
  // Registra el pago de una fecha programada de un fijo (sin pendiente).
  payOccurrence: (r, due, msg) => {
    const today = todayISO(), date = due > today && ymOf(due) === ymOf(today) ? today : due;
    rememberMethod(r.methodId);
    return Store.saveTx({ id: uid(), type: r.type, amount: r.amount, categoryId: r.categoryId, methodId: r.methodId, date, note: r.name, recurrenceId: r.id, dueDate: due }, msg || `${r.name} registrado`);
  },
};

function setSync(state, text) { $("#sync").innerHTML = `<span class="dot ${state}"></span><span>${esc(text)}</span>`; }

// ---------- auth ----------
function showLogin(msg = "") {
  $("#app").hidden = true; $("#fab").hidden = true; $("#login").hidden = false;
  $("#loginErr").textContent = msg;
}
async function onSession(session) {
  if (!session) { userId = null; return showLogin(); }
  if (userId === session.user.id) return;
  userId = session.user.id;
  $("#login").hidden = true; $("#app").hidden = false; $("#fab").hidden = false;
  render();
  await refresh(true);
  startRealtime();
}
async function doAuth(signup) {
  const email = $("#email").value.trim(), password = $("#password").value;
  if (!email || password.length < 6) { $("#loginErr").textContent = "Escribe tu correo y una contraseña de al menos 6 caracteres."; return; }
  $("#loginErr").textContent = "";
  const btns = document.querySelectorAll("#login button"); btns.forEach(b => b.disabled = true);
  const { data, error } = signup ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  btns.forEach(b => b.disabled = false);
  if (error) {
    const m = error.message || "";
    $("#loginErr").textContent = /Invalid login/i.test(m) ? "Correo o contraseña incorrectos." : /not confirmed/i.test(m) ? "Confirma tu correo primero (revisa tu bandeja)." : /not allowed|disabled/i.test(m) ? "El registro de cuentas nuevas está desactivado." : m;
    return;
  }
  if (signup && !data.session) $("#loginErr").textContent = "Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.";
}

// ---------- derived data ----------
function monthTx(ym = S.ym) { return S.tx.filter(t => ymOf(t.date) === ym); }
const isFixedTx = t => !!(t.recurrenceId || t.fixedId);
function sums(list) {
  let gasto = 0, ingreso = 0, fijo = 0, retiro = 0, ahorro = 0;
  for (const t of list) {
    if (t.type === "ingreso") ingreso += t.amount;
    else if (t.type === "retiro") retiro += t.amount;
    else if (t.type === "ahorro") ahorro += t.amount;
    else { gasto += t.amount; if (isFixedTx(t)) fijo += t.amount; }
  }
  return { gasto, ingreso, fijo, retiro, ahorro, balance: ingreso - gasto };
}
function byCategory(list) {
  const m = new Map();
  for (const t of list) if (t.type === "gasto") m.set(t.categoryId, (m.get(t.categoryId) || 0) + t.amount);
  return [...m.entries()].map(([id, v]) => ({ c: cat(id), v })).sort((a, b) => b.v - a.v);
}
// Fechas programadas de los fijos en el mes, con su estado, más los pendientes sueltos (Siri, correo).
// status: pagado | confirmar (hay pendiente) | porpagar | omitido (pendiente descartado)
function monthPlan(ym = S.ym) {
  const items = [], used = new Set();
  for (const r of S.recs) {
    if (!r.active) continue;
    for (const date of occInMonth(r, ym)) {
      const tx = S.tx.find(t => t.recurrenceId === r.id && t.dueDate === date);
      const pe = S.pending.find(p => p.recurrenceId === r.id && p.date === date);
      if (pe) used.add(pe.id);
      const status = tx ? "pagado" : pe ? (pe.status === "pendiente" ? "confirmar" : "omitido") : "porpagar";
      items.push({ r, date, tx, pe, status, type: r.type, name: r.name, amount: tx ? tx.amount : pe ? pe.amount : r.amount });
    }
  }
  for (const p of S.pending) if (p.status === "pendiente" && !used.has(p.id) && ymOf(p.date) === ym)
    items.push({ r: S.recs.find(x => x.id === p.recurrenceId) || null, date: p.date, pe: p, status: "confirmar", type: p.type, name: p.note || cat(p.categoryId).name, amount: p.amount });
  return items.sort((a, b) => a.date.localeCompare(b.date));
}
const isOpen = it => it.status === "porpagar" || it.status === "confirmar";
function monthOutlook(ym = S.ym) {
  const s = sums(monthTx(ym)), plan = monthPlan(ym);
  const porPagar = plan.filter(it => it.type === "gasto" && isOpen(it)).reduce((a, it) => a + it.amount, 0);
  const porRecibir = plan.filter(it => it.type === "ingreso" && isOpen(it)).reduce((a, it) => a + it.amount, 0);
  const fijosEsperados = s.fijo + porPagar;
  return { s, plan, porPagar, porRecibir, esperado: s.gasto + porPagar, quedan: s.ingreso + porRecibir - s.gasto - porPagar - s.ahorro, fijosEsperados };
}
// Sugerencia de ahorro: ingreso esperado − fijos esperados − promedio de gasto variable (3 meses previos) − 10% de margen.
function savingSuggestion(o) {
  const ingreso = o.s.ingreso + o.porRecibir;
  const prev = [1, 2, 3].map(i => sums(monthTx(ymAdd(S.ym, -i)))).filter(x => x.gasto || x.ingreso);
  const promVar = prev.length ? prev.reduce((a, x) => a + (x.gasto - x.fijo), 0) / prev.length : o.s.gasto - o.s.fijo;
  const margen = ingreso * 0.10, raw = ingreso - o.fijosEsperados - promVar - margen;
  const step = raw >= 2000 ? 100 : 50, sug = Math.max(0, Math.floor(raw / step) * step);
  return { sug, ingreso, promVar, margen, meses: prev.length, apartado: o.s.ahorro };
}
function byMethod(list) {
  const m = new Map();
  for (const t of list) if (t.type === "gasto") m.set(t.methodId || "", (m.get(t.methodId || "") || 0) + t.amount);
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
function cashBalance(list) {
  const cash = new Set(S.methods.filter(m => m.kind === "efectivo").map(m => m.id));
  let retiros = 0, gastos = 0;
  for (const t of list) { if (t.type === "retiro") retiros += t.amount; else if (t.type === "gasto" && cash.has(t.methodId)) gastos += t.amount; }
  return { retiros, gastos, saldo: retiros - gastos };
}

// ---------- charts ----------
function weekChart(list) {
  const weeks = [0,0,0,0,0];
  for (const t of list) if (t.type === "gasto") { const d = +t.date.slice(8,10); weeks[Math.min(4, Math.floor((d-1)/7))] += t.amount; }
  const n = daysIn(S.ym) > 28 ? 5 : 4, data = weeks.slice(0, n);
  const max = Math.max(1, ...data), W = 360, H = 170, bw = 44, gap = (W - 30 - n*bw) / n;
  let bars = "";
  data.forEach((v, i) => {
    const h = Math.round((v / max) * 110), x = 30 + gap/2 + i*(bw+gap), y = 135 - h;
    const from = i*7+1, last = i === n-1 ? daysIn(S.ym) : (i+1)*7;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="5" fill="var(--spend)" opacity="${v ? 1 : .25}"><title>${fmt(v)}</title></rect>
      <text x="${x+bw/2}" y="${y-6}" text-anchor="middle" class="num">${v ? fmt(v, true) : ""}</text>
      <text x="${x+bw/2}" y="152" text-anchor="middle">Sem ${i+1}</text>
      <text x="${x+bw/2}" y="165" text-anchor="middle" style="font-size:9.5px">${from}–${last}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gastos por semana"><line x1="30" x2="${W}" y1="135.5" y2="135.5" stroke="var(--line)"/>${bars}</svg>`;
}
function trendChart() {

  const data = months.map(m => sums(monthTx(m)));
  const max = Math.max(1, ...data.map(d => Math.max(d.gasto, d.ingreso)));
  const W = 360, H = 170, slot = (W-10)/6, bw = 16;
  let g = "";
  data.forEach((d, i) => {
    const x = 10 + i*slot + slot/2, hi = Math.round(d.ingreso/max*115), hg = Math.round(d.gasto/max*115);
    g += `<rect x="${x-bw-2}" y="${140-hi}" width="${bw}" height="${Math.max(hi,1)}" rx="4" fill="var(--income)"><title>Ingresos ${fmt(d.ingreso)}</title></rect>
      <rect x="${x+2}" y="${140-hg}" width="${bw}" height="${Math.max(hg,1)}" rx="4" fill="var(--spend)"><title>Gastos ${fmt(d.gasto)}</title></rect>
      <text x="${x}" y="158" text-anchor="middle" style="${months[i]===S.ym?"font-weight:700;fill:var(--ink)":""}">${monthName(months[i], {month:"short"}).replace(".","")}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos 6 meses"><line x1="10" x2="${W}" y1="140.5" y2="140.5" stroke="var(--line)"/>${g}</svg>
  <div class="legend" style="margin-top:6px"><span><i class="sw" style="background:var(--income)"></i>Ingresos</span><span><i class="sw" style="background:var(--spend)"></i>Gastos</span></div>`;
}

function methodBreakdown(list) {

        return `<button type="button" data-palette="${k}" aria-pressed="${k === pal}" style="background:${c.bg};color:${c.ink}"><b>${esc(t.name)}</b><span class="chips"><i style="background:${c.brand}"></i><i style="background:${c.spend}"></i><i style="background:${c.income}"></i></span></button>`; }).join("")}</div>
      <h2 style="margin-top:20px">Apariencia</h2>

// ---------- dialogs ----------
const dlg = $("#dlg"), form = $("#dlgForm");
function openDialog(html, bind) { form.innerHTML = html; bind(form); if (!dlg.open) dlg.showModal(); }
const close = () => dlg.close();
const foot = (isNew, saveLabel) => `<div class="mfoot">${isNew ? "" : `<button type="button" class="btn danger" data-del>Eliminar</button>`}<span class="spacer"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button type="button" class="btn" data-save>${saveLabel || (isNew ? "Agregar" : "Guardar cambios")}</button></div>`;
const NEW = "__nuevo";
const catOptions = (kind, sel) => catsOf(kind).map(c => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.name)}</option>`).join("") + `<option value="${NEW}">+ Agregar categoría nueva</option>`;
const methodOptions = (sel, filter = () => true) => `<option value="">Sin método</option>` + S.methods.filter(m => (m.active || m.id === sel) && filter(m)).map(m => `<option value="${esc(m.id)}" ${m.id === sel ? "selected" : ""}>${esc(m.name)}</option>`).join("") + `<option value="${NEW}">+ Agregar método nuevo</option>`;
const amountField = (label, val) => `<label class="f big">${label}<input name="amount" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(val)}" placeholder="0.00"></label>`;
const freqField = (r, salary) => `<label class="f">Frecuencia<select name="freq">${Object.entries(FREQS).filter(([k]) => k !== "salario" || salary || r.freq === "salario").map(([k, l]) => `<option value="${k}" ${k === r.freq ? "selected" : ""}>${k === "quincenal" ? "Quincenal (cada 15 días)" : k === "salario" ? "Quincena de salario (día 15 y último día del mes)" : l}</option>`).join("")}</select></label>`;
const modeField = r => `<label class="f">Cuando toque<select name="mode"><option value="confirmar" ${r.mode !== "recordatorio" ? "selected" : ""}>Avisarme para confirmar el monto</option><option value="recordatorio" ${r.mode === "recordatorio" ? "selected" : ""}>Solo recordarme (lo registro yo)</option></select></label>`;

// "+ Agregar categoría/método nuevo" dentro de un select: muestra un campo para crearlo ahí mismo y lo deja seleccionado.
function inlineNew(f, sel, kind) {
  let prev = sel.value === NEW ? "" : sel.value;
  sel.addEventListener("change", () => {
    if (sel.value !== NEW) { prev = sel.value; return; }
    const box = document.createElement("div");
    box.className = "inline-new";
    box.innerHTML = `<input type="text" maxlength="40" placeholder="${kind === "method" ? "Ej. BBVA Crédito" : "Ej. Colegiatura"}" aria-label="Nombre"><button type="button" class="btn sm">Crear</button><button type="button" class="btn ghost sm">Cancelar</button>`;
    sel.closest("label").after(box);
    sel.disabled = true;
    const [inp, ok, no] = box.children;
    const done = () => { box.remove(); sel.disabled = false; };
    no.onclick = () => { sel.value = prev; done(); };
    ok.onclick = async () => {
      const name = inp.value.trim(); if (!name) { inp.focus(); return; }
      ok.disabled = true;
      const id = uid(), k = typeof kind === "function" ? kind() : kind;
      if (k === "method") {
        const m = { id, name, kind: /efectivo/i.test(name) ? "efectivo" : /cr[eé]dito/i.test(name) ? "credito" : /d[eé]bito/i.test(name) ? "debito" : "otro", color: PALETTE[S.methods.length % PALETTE.length], active: true };
        if (!await Store.saveMethod(m, "Método agregado")) { ok.disabled = false; return; }
        if (!S.methods.some(x => x.id === id)) S.methods.push(m);
        sel.innerHTML = methodOptions(id);
      } else {
        const c = { id, name, kind: k, color: PALETTE[S.categories.length % PALETTE.length], budget: 0 };
        if (!await Store.saveCat(c, "Categoría agregada")) { ok.disabled = false; return; }
        if (!S.categories.some(x => x.id === id)) S.categories.push(c);
        sel.innerHTML = catOptions(k, id);
      }
      sel.value = id; prev = id; done(); sel.dispatchEvent(new Event("change"));
    };
    setTimeout(() => inp.focus(), 30);
  });
}

function openTx(t, preset = {}) {
  const isNew = !t;
  t = t || { id: uid(), type: preset.type || "gasto", amount:"", categoryId: catsOf(preset.type === "ingreso" ? "ingreso" : "gasto")[0]?.id, methodId: lastMethod(), goalId: preset.goalId || S.goals.find(g => g.active)?.id, date: ymOf(todayISO()) === S.ym ? todayISO() : `${S.ym}-01`, note:"" };
  let type = t.type;
  const rec = S.recs.find(r => r.id === (t.recurrenceId || t.fixedId));
  const linked = rec || t.fixedId;
  const types = [["gasto","Gasto"],["ingreso","Ingreso"],["retiro","Retiro"],["ahorro","Ahorro"]];
  openDialog(`
    <div class="mhead">${isNew ? "Nuevo movimiento" : "Editar movimiento"}</div>
    <div class="mbody">
      <div class="seg" role="group">${types.map(([k, l]) => `<button type="button" data-type="${k}" aria-pressed="${type === k}">${l}</button>`).join("")}</div>
      ${amountField("Monto", t.amount)}
      <label class="f" data-for="cat">Categoría<select name="categoryId"></select></label>
      <label class="f" data-for="goal">Meta<select name="goalId">${S.goals.filter(g => g.active || g.id === t.goalId).map(g => `<option value="${esc(g.id)}" ${g.id === t.goalId ? "selected" : ""}>${esc(g.name)}</option>`).join("")}</select></label>
      <div class="sub" data-for="nogoal">Primero crea una meta en Resumen → Metas de ahorro.</div>
      <label class="f"><span data-mlabel>Método de pago</span><select name="methodId"></select></label>
      <label class="f">Fecha<input name="date" type="date" value="${esc(t.date)}"></label>
      <label class="f">Nota<input name="note" type="text" maxlength="120" value="${esc(t.note)}" placeholder="Ej. supermercado"></label>
      <div class="sub" data-for="retiro">Un retiro pasa dinero de tu cuenta a efectivo. No cuenta como gasto; registra después lo que pagues en efectivo con el método Efectivo.</div>
      ${isNew ? `<div data-for="fijo" class="fijobox">
        <label class="check"><input type="checkbox" name="isFixed"> <span data-fijolabel>Es fijo (se repite)</span></label>
        <div data-fijo hidden style="display:grid;gap:12px"><div data-freqbox></div>${modeField({})}</div>
      </div>` : linked ? `<div class="sub">Registrado desde el fijo ${esc(rec?.name || "")}${t.dueDate ? ` del ${dShort(t.dueDate)}` : ""}.</div>` : ""}
    </div>${foot(isNew)}`,
  f => {
    const show = (k, on) => f.querySelectorAll(`[data-for="${k}"]`).forEach(x => x.hidden = !on);
    const setMethods = () => { f.methodId.innerHTML = methodOptions(f.methodId.value || t.methodId, m => type !== "retiro" || m.kind !== "efectivo"); f.querySelector("[data-mlabel]").textContent = type === "retiro" ? "Retirado de" : type === "ingreso" ? "Recibido en" : type === "ahorro" ? "Desde" : "Método de pago"; };
    // Con categoría de salario se sugiere la quincena de salario (15 y último día); esa opción solo existe para el salario.
    const setFreq = () => { const box = f.querySelector("[data-freqbox]"); if (!box) return; const sal = isSalaryCat(f.categoryId.value), cur = f.freq?.value; box.innerHTML = freqField({ freq: sal && (!cur || cur === "mensual") ? "salario" : !sal && cur === "salario" ? "mensual" : cur || "mensual" }, sal); };
    const apply = () => {
      const cats = type === "gasto" || type === "ingreso";
      show("cat", cats); show("goal", type === "ahorro" && S.goals.length); show("nogoal", type === "ahorro" && !S.goals.length);
      show("retiro", type === "retiro"); show("fijo", cats);
      if (cats) { const keep = catsOf(type).some(c => c.id === f.categoryId.value) ? f.categoryId.value : t.type === type ? t.categoryId : catsOf(type)[0]?.id; f.categoryId.innerHTML = catOptions(type, keep); }
      setMethods(); setFreq();
      const sv = f.querySelector("[data-save]"); sv.classList.toggle("spend", type === "gasto"); sv.classList.toggle("inc", type === "ingreso");
      const fl = f.querySelector("[data-fijolabel]"); if (fl) fl.textContent = type === "ingreso" ? "Es un ingreso fijo (se repite)" : "Es un gasto fijo (se repite)";
    };
    apply();
    inlineNew(f, f.categoryId, () => type);
    f.categoryId.addEventListener("change", () => { if (f.categoryId.value !== NEW) setFreq(); });
    inlineNew(f, f.methodId, "method");
    f.querySelectorAll("[data-type]").forEach(b => b.onclick = () => {
      type = b.dataset.type;
      f.querySelectorAll("[data-type]").forEach(x => x.setAttribute("aria-pressed", x === b));
      apply();
    });
    f.isFixed?.addEventListener("change", () => { f.querySelector("[data-fijo]").hidden = !f.isFixed.checked; setFreq(); });
    f.querySelector("[data-close]").onclick = close;
    f.querySelector("[data-del]")?.addEventListener("click", () => { if (confirm("¿Eliminar este movimiento?")) { close(); Store.delTx(t.id, "Movimiento eliminado"); } });
    f.querySelector("[data-save]").onclick = async () => {
      const amount = parseFloat(f.amount.value);
      if (!(amount > 0)) { f.amount.focus(); toast("Escribe un monto mayor que cero"); return; }
      if (!f.date.value) { f.date.focus(); return; }
      if (type === "ahorro" && !f.goalId.value) { toast("Primero crea una meta de ahorro"); return; }
      if ((type === "gasto" || type === "ingreso") && (!f.categoryId.value || f.categoryId.value === NEW)) { toast("Elige una categoría"); return; }
      const methodId = f.methodId.value === NEW ? "" : f.methodId.value;
      const rec = { ...t, type, amount: Math.round(amount*100)/100, categoryId: type === "gasto" || type === "ingreso" ? f.categoryId.value : null, goalId: type === "ahorro" ? f.goalId.value : null, methodId, date: f.date.value, note: f.note.value.trim() };
      if (isNew && f.isFixed?.checked && (type === "gasto" || type === "ingreso")) {
        const r = { id: uid(), name: rec.note || cat(rec.categoryId).name, type, amount: rec.amount, original: rec.amount, categoryId: rec.categoryId, methodId, freq: f.freq.value, start: rec.date, day: +rec.date.slice(8), mode: f.mode.value, active: true };
        r.next = occOnOrAfter(r, isoAdd(rec.date, 1));
        if (!await check(sb.from("recurrences").insert(recDb(r)))) return;
        S.recs.push(r);
        rec.recurrenceId = r.id; rec.dueDate = rec.date;
      }
      close();
      rememberMethod(methodId);
      if (isNew && ymOf(rec.date) !== S.ym) S.ym = ymOf(rec.date);
      await Store.saveTx(rec, isNew ? (rec.recurrenceId ? "Movimiento agregado y guardado como fijo" : "Movimiento agregado") : "Cambios guardados");
      if (rec.recurrenceId) refresh();
    };
    setTimeout(() => f.amount.focus(), 50);
  });
}

function openPending(p) {
  let type = p.type;
  openDialog(`
    <div class="mhead">Confirmar ${type === "ingreso" ? "ingreso" : type === "retiro" ? "retiro" : "gasto"}</div>
    <div class="mbody">
      <div class="sub">${SOURCE[p.source]}${p.recurrenceId ? ` · programado para el ${dShort(p.date)}` : ""}. Revisa el monto antes de aceptar.</div>
      ${amountField("Monto", p.amount)}
      ${type !== "retiro" ? `<label class="f">Categoría<select name="categoryId">${catOptions(type, p.categoryId)}</select></label>` : ""}
      <label class="f">Método de pago<select name="methodId">${methodOptions(p.methodId)}</select></label>
      <label class="f">Fecha<input name="date" type="date" value="${esc(p.date)}"></label>
      <label class="f">Nota<input name="note" type="text" maxlength="120" value="${esc(p.note)}"></label>
    </div>
    <div class="mfoot"><button type="button" class="btn danger" data-discard>Descartar</button><span class="spacer"></span><button type="button" class="btn ghost" data-close>Después</button><button type="button" class="btn ${type === "gasto" ? "spend" : type === "ingreso" ? "inc" : ""}" data-save>Aceptar</button></div>`,
  f => {
    if (f.categoryId) inlineNew(f, f.categoryId, () => type);
    inlineNew(f, f.methodId, "method");
    f.querySelector("[data-close]").onclick = close;
    f.querySelector("[data-discard]").onclick = () => { if (confirm("¿Descartar este pendiente? No se registrará ningún movimiento.")) { close(); Store.discardPending(p); } };
    f.querySelector("[data-save]").onclick = async () => {
      const amount = parseFloat(f.amount.value);
      if (!(amount > 0)) { f.amount.focus(); toast("Escribe un monto mayor que cero"); return; }
      if (f.categoryId && (!f.categoryId.value || f.categoryId.value === NEW)) { toast("Elige una categoría"); return; }
      close();
      await Store.acceptPending(p, { type, amount: Math.round(amount*100)/100, categoryId: f.categoryId ? f.categoryId.value : null, methodId: f.methodId.value === NEW ? "" : f.methodId.value, date: f.date.value || p.date, note: f.note.value.trim() });
    };
    setTimeout(() => f.amount.select(), 50);
  });
}

    const setFreq = () => { const sal = isSalaryCat(f.categoryId.value), cur = f.freq.value; f.querySelector("[data-freqbox]").innerHTML = freqField({ freq: sal && cur === "mensual" ? "salario" : !sal && cur === "salario" ? "mensual" : cur }, sal); f.freq.onchange = label; label(); };
    f.freq.onchange = label;
    inlineNew(f, f.categoryId, () => type);
    f.categoryId.addEventListener("change", () => { if (f.categoryId.value !== NEW) setFreq(); });

    });
    f.querySelector("[data-close]").onclick = close;
    f.querySelector("[data-del]")?.addEventListener("click", () => { if (confirm(`¿Eliminar el fijo "${r.name}"? Los movimientos ya registrados se conservan.`)) { close(); Store.delRec(r.id, "Fijo eliminado"); } });
    f.querySelector("[data-save]").onclick = () => {

      if (!(amount > 0)) { f.amount.focus(); toast("Escribe un monto mayor que cero"); return; }
      if (!f.categoryId.value || f.categoryId.value === NEW) { toast("Elige una categoría"); return; }
      if (!f.start.value) { f.start.focus(); return; }
      const nr = { ...r, name, type, amount: Math.round(amount*100)/100, categoryId: f.categoryId.value, methodId: f.methodId.value === NEW ? "" : f.methodId.value, freq: f.freq.value, start: f.start.value, day: +f.start.value.slice(8), mode: f.mode.value, active: f.active.checked };
      if (isNew) nr.original = nr.amount;
      // Los pendientes se generan desde el inicio de este mes (o desde la primera fecha si es posterior), sin acumular meses pasados.
      if (isNew || nr.freq !== r.freq || nr.start !== r.start) { const m0 = ymOf(todayISO()) + "-01"; nr.next = occOnOrAfter(nr, isNew ? m0 : todayISO()); }
      close();
      Store.saveRec(nr, isNew ? "Fijo agregado" : "Cambios guardados");
    };
  });
}

    <div class="mbody">
      <label class="f">Nombre<input name="name" maxlength="40" value="${esc(c.name)}" placeholder="Ej. Mascotas"></label>
      ${c.kind === "gasto" ? `<label class="f">Presupuesto mensual (opcional)<input name="budget" type="number" inputmode="decimal" step="0.01" min="0" value="${c.budget || ""}" placeholder="0.00"></label>` : ""}
      <div style="display:grid;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted)">Color<div class="colors">${PALETTE.map(p => `<button type="button" style="background:${p}" data-color="${p}" aria-pressed="${p === color}" aria-label="Color ${p}"></button>`).join("")}</div></div>
    </div>${foot(isNew)}`,
  f => {
    f.querySelectorAll("[data-color]").forEach(b => b.onclick = () => { color = b.dataset.color; f.querySelectorAll("[data-color]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    f.querySelector("[data-close]").onclick = close;
    f.querySelector("[data-del]")?.addEventListener("click", () => deleteCat(c));
    f.querySelector("[data-save]").onclick = () => {
      const name = f.name.value.trim();
      if (!name) { f.name.focus(); toast("Escribe un nombre"); return; }
      close();
      Store.saveCat({ ...c, name, color, budget: f.budget ? Math.max(0, parseFloat(f.budget.value) || 0) : 0 }, isNew ? "Categoría agregada" : "Cambios guardados");
    };
    setTimeout(() => f.name.focus(), 50);
  });
}

// Eliminar categoría: si tiene movimientos o fijos, muestra cuáles y pide a qué categoría moverlos.
async function deleteCat(c) {
  if (catsOf(c.kind).length <= 1) { toast("Debe quedar al menos una categoría"); return; }
  const { data, count, error } = await sb.from("transactions").select("id,type,amount,date,note", { count:"exact" }).eq("category_id", c.id).order("date", { ascending:false }).limit(8);
  if (error) { toast("No se pudo revisar la categoría: " + error.message); return; }
  const recs = S.recs.filter(r => r.categoryId === c.id), pends = pendingOpen().filter(p => p.categoryId === c.id);
  if (!count && !recs.length && !pends.length) {
    if (confirm(`¿Eliminar la categoría "${c.name}"? No tiene movimientos registrados.`)) { close(); Store.delCat(c.id, "Categoría eliminada"); }
    return;
  }
  const others = catsOf(c.kind).filter(x => x.id !== c.id);
  const fallback = others.find(x => /^otros/i.test(x.name)) || others[0];
  openDialog(`
    <div class="mhead">Eliminar "${esc(c.name)}"</div>
    <div class="mbody">
      <div class="warnbox">Hay movimientos registrados en esta categoría. Elige a dónde moverlos antes de eliminarla; no se borrará ningún movimiento.</div>
      ${recs.map(r => `<div class="sub">• Tienes un ${r.type === "ingreso" ? "ingreso" : "gasto"} fijo de <b>${esc(r.name)}</b> de <b class="num">${fmt(r.amount)}</b> (${esc(freqText(r).toLowerCase())}).</div>`).join("")}
      ${count ? `<div><div class="sub" style="font-weight:700;margin-bottom:4px">${count} movimiento${count > 1 ? "s" : ""}:</div>${data.map(t => `<div class="sub num">• ${dShort(t.date)}/${t.date.slice(0,4)} · ${esc(t.note || c.name)} · ${fmt(+t.amount)}</div>`).join("")}${count > data.length ? `<div class="sub">… y ${count - data.length} más.</div>` : ""}</div>` : ""}
      ${pends.length ? `<div class="sub">• ${pends.length} pendiente${pends.length > 1 ? "s" : ""} por confirmar.</div>` : ""}
      <label class="f">¿A dónde los quieres mover?<select name="target">${catOptions(c.kind, fallback?.id).replace(`<option value="${esc(c.id)}"`, `<option hidden value="${esc(c.id)}"`)}</select></label>
    </div>
    <div class="mfoot"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button type="button" class="btn danger" data-save>Mover y eliminar</button></div>`,
  f => {
    inlineNew(f, f.target, c.kind);
    f.querySelector("[data-close]").onclick = close;
    f.querySelector("[data-save]").onclick = async () => {
      const to = f.target.value;
      if (!to || to === NEW || to === c.id) { toast("Elige la categoría destino"); return; }
      close();
      if (await check(sb.rpc("reassign_and_delete_category", { p_old: c.id, p_new: to }), `Movido a "${cat(to).name}" y categoría eliminada`)) refresh();
    };
  });
}

function openMethod(m) {
  const isNew = !m;
  m = m || { id: uid(), name:"", kind:"credito", color: PALETTE[S.methods.length % PALETTE.length], active:true };
  let color = m.color;
  const KINDS = [["credito","Tarjeta de crédito"],["debito","Tarjeta de débito"],["transferencia","Transferencia"],["spay","SPAY"],["efectivo","Efectivo"],["otro","Otro"]];
  openDialog(`
    <div class="mhead">${isNew ? "Nuevo método de pago" : "Editar método de pago"}</div>
    <div class="mbody">
      <label class="f">Nombre<input name="name" maxlength="40" value="${esc(m.name)}" placeholder="Ej. BBVA Crédito"></label>
      <label class="f">Tipo<select name="kind">${KINDS.map(([k, l]) => `<option value="${k}" ${k === m.kind ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <div style="display:grid;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted)">Color<div class="colors">${PALETTE.map(p => `<button type="button" style="background:${p}" data-color="${p}" aria-pressed="${p === color}" aria-label="Color ${p}"></button>`).join("")}</div></div>
      ${isNew ? "" : `<label class="check"><input type="checkbox" name="active" ${m.active ? "checked" : ""}> Activo (si lo desactivas ya no aparece al registrar, pero se conserva el historial)</label>`}
    </div>${foot(true, isNew ? "Agregar" : "Guardar cambios")}`,
  f => {
    f.querySelectorAll("[data-color]").forEach(b => b.onclick = () => { color = b.dataset.color; f.querySelectorAll("[data-color]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    f.querySelector("[data-close]").onclick = close;
    f.querySelector("[data-save]").onclick = () => {
      const name = f.name.value.trim();
      if (!name) { f.name.focus(); toast("Escribe un nombre"); return; }
      close();
      Store.saveMethod({ ...m, name, kind: f.kind.value, color, active: f.active ? f.active.checked : true }, isNew ? "Método agregado" : "Cambios guardados");
    };
    setTimeout(() => f.name.focus(), 50);
  });
}

function openGoal(g) {
  const isNew = !g;
  g = g || { id: uid(), name:"", target:"", targetDate:"", color: PALETTE[(S.goals.length + 3) % PALETTE.length], active:true };
  let color = g.color;
  openDialog(`
    <div class="mhead">${isNew ? "Nueva meta de ahorro" : "Editar meta"}</div>
    <div class="mbody">
      <label class="f">Nombre<input name="name" maxlength="40" value="${esc(g.name)}" placeholder="Ej. Fondo de emergencia"></label>
      ${amountField("Monto objetivo", g.target)}
      <label class="f">Fecha objetivo (opcional)<input name="targetDate" type="date" value="${esc(g.targetDate || "")}"></label>
      <div style="display:grid;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted)">Color<div class="colors">${PALETTE.map(p => `<button type="button" style="background:${p}" data-color="${p}" aria-pressed="${p === color}" aria-label="Color ${p}"></button>`).join("")}</div></div>
    </div>${foot(isNew)}`,
  f => {
    f.querySelectorAll("[data-color]").forEach(b => b.onclick = () => { color = b.dataset.color; f.querySelectorAll("[data-color]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    f.querySelector("[data-close]").onclick = close;
    f.querySelector("[data-del]")?.addEventListener("click", () => { if (confirm(`¿Eliminar la meta "${g.name}"? Las aportaciones registradas se conservan como movimientos.`)) { close(); Store.delGoal(g.id, "Meta eliminada"); } });
    f.querySelector("[data-save]").onclick = () => {
      const name = f.name.value.trim(), target = parseFloat(f.amount.value);
      if (!name) { f.name.focus(); toast("Escribe un nombre"); return; }
      if (!(target > 0)) { f.amount.focus(); toast("Escribe el monto objetivo"); return; }
      close();
      Store.saveGoal({ ...g, name, target: Math.round(target*100)/100, targetDate: f.targetDate.value || null, color }, isNew ? "Meta creada" : "Cambios guardados");
    };
    setTimeout(() => f.name.focus(), 50);
  });
}

// ---------- events ----------
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (!b) return; S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
$("#pendBtn").onclick = () => { S.tab = "pend"; render(); window.scrollTo(0, 0); };
const goMonth = n => { S.ym = ymAdd(S.ym, n); render(); refresh(false); };
$("#prevM").onclick = () => goMonth(-1);
$("#nextM").onclick = () => goMonth(1);
$("#fab").onclick = () => openTx();
$("#view").addEventListener("click", e => {
  const t = e.target.closest("[data-edit],[data-payocc],[data-openpend],[data-editrec],[data-editcat],[data-delcat],[data-newcat],[data-editmethod],[data-editgoal],[data-addsave],[data-act]");
  if (!t) return;
  const d = t.dataset;
  if (d.edit) openTx(S.tx.find(x => x.id === d.edit));
  else if (d.payocc) { const [id, due] = d.payocc.split("|"), r = S.recs.find(x => x.id === id); if (r) Store.payOccurrence(r, due); }
  else if (d.openpend) { const p = S.pending.find(x => x.id === d.openpend); if (p) openPending(p); }
  else if (d.editrec) openRec(S.recs.find(x => x.id === d.editrec));
  else if (d.editcat) openCat(S.categories.find(x => x.id === d.editcat));
  else if (d.delcat) deleteCat(S.categories.find(x => x.id === d.delcat));
  else if (d.newcat) openCat(null, d.newcat);
  else if (d.editmethod) openMethod(S.methods.find(x => x.id === d.editmethod));
  else if (d.editgoal) openGoal(S.goals.find(x => x.id === d.editgoal));
  else if (d.addsave) openTx(null, { type:"ahorro", goalId: d.addsave });
  else if (d.act === "add" || d.act === "add-gasto") openTx();
  else if (d.act === "add-ingreso") openTx(null, { type:"ingreso" });
  else if (d.act === "fijos") { S.tab = "fijos"; render(); window.scrollTo(0, 0); }
  else if (d.act === "pend") { S.tab = "pend"; render(); window.scrollTo(0, 0); }
  else if (d.act === "newmethod") openMethod();
  else if (d.act === "newgoal") openGoal();
});
dlg.addEventListener("click", e => { if (e.target === dlg) close(); });
$("#signin").onclick = () => doAuth(false);
$("#signup").onclick = () => doAuth(true);
$("#password").addEventListener("keydown", e => { if (e.key === "Enter") doAuth(false); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && userId) refresh(true); });
window.addEventListener("online", () => userId && refresh(true));
window.addEventListener("offline", () => setSync("off", "Sin conexión"));

// ---------- start ----------
if (!sb) { showLogin("Falta configurar config.js con los datos de tu proyecto de Supabase."); document.querySelectorAll("#login button").forEach(b => b.disabled = true); return; }
// ---------- actualizaciones ----------
const fetchRemoteVersion = async () => {
  const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return (await r.json()).version;
};
const reloadFresh = () => location.replace("./?v=" + Date.now());
let dismissedVersion = null;
const checkForUpdate = async () => {
  try {
    const v = await fetchRemoteVersion();
    if (v && v !== APP_VERSION && v !== dismissedVersion) { $("#updateBar").dataset.v = v; $("#updateBar").hidden = false; }
  } catch (e) { /* sin conexión: se reintenta al volver a la app */ }
};
$("#updateGo").onclick = reloadFresh;
$("#updateX").onclick = () => { dismissedVersion = $("#updateBar").dataset.v; $("#updateBar").hidden = true; };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });
checkForUpdate();

sb.auth.getSession().then(({ data }) => onSession(data.session));
sb.auth.onAuthStateChange((_e, session) => { setTimeout(() => { if (!session) { userId = null; showLogin(); } else onSession(session); }, 0); });
})();

</script>
</body>
</html>
