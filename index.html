<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mis finanzas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1.7.0">
<link rel="icon" href="icon-192.png?v=1.7.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Sacramento&display=swap" rel="stylesheet">
<script>
// Temas: cada uno con versión clara y oscura. Regla fija en todos: gastos en rojo (--spend) e ingresos en verde (--income).
window.THEMES = {
  clasico:  { name:"Bosque", L:{bg:"#EDF2EF",surface:"#FFFFFF",surface2:"#F5F8F6",ink:"#17251F",muted:"#5E6E67",line:"#D5DFDA",brand:"#1F6F5C",brandInk:"#FFFFFF",spend:"#C93636",onSpend:"#FFFFFF",income:"#1E7A3C",onIncome:"#FFFFFF",warn:"#B4541A",track:"#E1E9E5"},
                                D:{bg:"#101815",surface:"#18231F",surface2:"#1E2B26",ink:"#E6EEEA",muted:"#98A8A1",line:"#2B3A34",brand:"#4FB597",brandInk:"#0D1714",spend:"#F07575",onSpend:"#1A0B0B",income:"#5CC77E",onIncome:"#0B1A10",warn:"#E59A62",track:"#26342E"} },
  esmeralda:{ name:"Esmeralda", L:{bg:"#EEF6F2",surface:"#FFFFFF",surface2:"#F4FAF7",ink:"#10231B",muted:"#58706A",line:"#D3E4DC",brand:"#0E9F6E",brandInk:"#FFFFFF",spend:"#DC2F3C",onSpend:"#FFFFFF",income:"#15803D",onIncome:"#FFFFFF",warn:"#E07A1F",track:"#DCEBE4"},
                                D:{bg:"#0B1612",surface:"#13221C",surface2:"#1A2B24",ink:"#E4F1EB",muted:"#93ACA3",line:"#22362E",brand:"#34D399",brandInk:"#06140F",spend:"#F87171",onSpend:"#1A0808",income:"#4ADE80",onIncome:"#06140B",warn:"#F59E4B",track:"#1D2F28"} },
  oceano:   { name:"Océano", L:{bg:"#EEF3FB",surface:"#FFFFFF",surface2:"#F5F8FD",ink:"#0F1B2E",muted:"#5A6880",line:"#D4DEEE",brand:"#1769F0",brandInk:"#FFFFFF",spend:"#DC2F3C",onSpend:"#FFFFFF",income:"#0F7F4D",onIncome:"#FFFFFF",warn:"#C2850A",track:"#DCE5F4"},
                                D:{bg:"#0A111D",surface:"#121C2C",surface2:"#18243A",ink:"#E3ECFA",muted:"#93A3BD",line:"#22314A",brand:"#5B9BFF",brandInk:"#07101F",spend:"#F87171",onSpend:"#1A0808",income:"#3DD39A",onIncome:"#04150D",warn:"#FBBF24",track:"#1B2840"} },
  mandarina:{ name:"Mandarina", L:{bg:"#FBF3EE",surface:"#FFFFFF",surface2:"#FDF8F5",ink:"#2A1810",muted:"#7A6257",line:"#EEDDD3",brand:"#E2531A",brandInk:"#FFFFFF",spend:"#C8102E",onSpend:"#FFFFFF",income:"#13784F",onIncome:"#FFFFFF",warn:"#B45309",track:"#F3E4DA"},
                                D:{bg:"#170F0B",surface:"#231711",surface2:"#2C1E17",ink:"#F8E9E1",muted:"#B79C8F",line:"#3A2A21",brand:"#FF8A4C",brandInk:"#1C0E07",spend:"#FF6B6B",onSpend:"#1C0707",income:"#34D399",onIncome:"#04150D",warn:"#FBBF24",track:"#33231B"} },
  ciruela:  { name:"Ciruela", L:{bg:"#F4F1FA",surface:"#FFFFFF",surface2:"#F8F6FC",ink:"#1C1530",muted:"#675F80",line:"#E0D9EE",brand:"#6D28D9",brandInk:"#FFFFFF",spend:"#D92D3A",onSpend:"#FFFFFF",income:"#15803D",onIncome:"#FFFFFF",warn:"#B45309",track:"#E8E2F4"},
                                D:{bg:"#110D1B",surface:"#1B1529",surface2:"#221B33",ink:"#EEE8FA",muted:"#A69CC0",line:"#2E2545",brand:"#A78BFA",brandInk:"#120B22",spend:"#F87171",onSpend:"#1A0808",income:"#4ADE80",onIncome:"#06140B",warn:"#FBBF24",track:"#272038"} },
};
(() => {
  const vars = (t, dark) => `--bg:${t.bg};--surface:${t.surface};--surface-2:${t.surface2};--ink:${t.ink};--muted:${t.muted};--line:${t.line};--brand:${t.brand};--brand-ink:${t.brandInk};--spend:${t.spend};--on-spend:${t.onSpend};--income:${t.income};--on-income:${t.onIncome};--warn:${t.warn};--track:${t.track};--save:${dark ? "#6FA8DC" : "#2F6EA8"};--invest:${dark ? "#A78BFA" : "#7A5BB0"};--shadow:${dark ? "none" : "0 1px 0 rgba(0,0,0,.06)"};color-scheme:${dark ? "dark" : "light"};`;
  let css = "";
  for (const [k, t] of Object.entries(THEMES)) {
    const sel = k === "clasico" ? ":root" : `:root[data-palette="${k}"]`;
    css += `${sel}{${vars(t.L)}}@media (prefers-color-scheme:dark){${sel}:not([data-theme="light"]){${vars(t.D, true)}}}${sel}[data-theme="dark"]{${vars(t.D, true)}}`;
  }
  const st = document.createElement("style"); st.id = "themeCss"; st.textContent = css; document.head.appendChild(st);
  const get = k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
  window.applyTheme = (palette, mode) => {
    palette = THEMES[palette] ? palette : "clasico"; mode = mode === "light" || mode === "dark" ? mode : "auto";
    const r = document.documentElement;
    if (palette === "clasico") r.removeAttribute("data-palette"); else r.setAttribute("data-palette", palette);
    if (mode === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", mode);
    // Color de la barra de estado del iPhone según el tema
    document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove());
    const add = (c, media) => { const m = document.createElement("meta"); m.name = "theme-color"; m.content = c; if (media) m.media = media; document.head.appendChild(m); };
    const t = THEMES[palette];
    if (mode === "auto") { add(t.L.bg, "(prefers-color-scheme: light)"); add(t.D.bg, "(prefers-color-scheme: dark)"); } else add(mode === "dark" ? t.D.bg : t.L.bg);
    try { localStorage.setItem("finanzas.palette", palette); localStorage.setItem("finanzas.mode", mode); } catch {}
  };
  applyTheme(get("finanzas.palette"), get("finanzas.mode"));
})();
</script>
<style>
:root{
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px,1em)}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--income)} .dot.off{background:var(--warn)}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.month button:hover{background:var(--surface-2);color:var(--ink)}
.month span{min-width:140px;text-align:center;font-weight:600;text-transform:capitalize}
nav.tabs{display:flex;gap:4px;margin-bottom:18px}
nav.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button{transition:background-color .3s cubic-bezier(.32,.72,0,1),color .3s,transform .15s ease-out;-webkit-tap-highlight-color:transparent}
nav.tabs button:active{transform:scale(.92)}
nav.tabs button[aria-current="true"] svg{animation:tabPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes tabPop{0%{transform:scale(.8) translateY(2px)}55%{transform:scale(1.15) translateY(-2px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){nav.tabs button,nav.tabs button[aria-current="true"] svg{animation:none;transition:none}}
nav.tabs svg{display:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:720px){
  .wrap{padding-bottom:124px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;background:var(--surface);border-top:1px solid var(--line);padding:5px 8px calc(5px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:6px}
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;padding:7px 4px 6px;min-height:48px;border-radius:12px}
  nav.tabs svg{display:block;width:22px;height:22px}
  .month span{min-width:118px;font-size:.95rem}
}
.banner{background:var(--surface);border:1px solid var(--warn);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}
@media (max-width:820px){.g2{grid-template-columns:1fr}}
h2{font-size:1rem;margin:0 0 12px;font-weight:700}
.sub{color:var(--muted);font-size:.85rem}

/* Hero */
.hero{padding:22px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.spent{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-size:1.1rem}
.strip{display:flex;height:34px;border-radius:9px;overflow:hidden;margin:20px 0 10px;background:var(--track)}
.strip i{display:block;height:100%;min-width:2px;transition:flex-grow .4s ease}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}

/* category rows */
.crow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.crow .vals{text-align:right}
.bar{grid-column:1/-1;height:6px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px}
.over{color:var(--warn);font-weight:600}

svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart{width:100%;height:auto;display:block}

/* lists */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.toolbar input{flex:1 1 180px}
.day{font-size:.8rem;color:var(--muted);font-weight:600;margin:16px 4px 6px;text-transform:capitalize}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:6px;cursor:pointer}
.tx:hover{border-color:var(--muted)}
.tx .ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.85rem}
.tx .mid{flex:1;min-width:0}
.tx .mid div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700}
.amt.gasto{color:var(--spend)} .amt.ingreso{color:var(--income)}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:6px;font-weight:500}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty button{margin-top:12px}

.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:21;width:58px;height:58px;border-radius:18px;border:0;background:var(--brand);color:var(--brand-ink);font-size:2rem;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
@media (max-width:720px){.fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

.fixed-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.fixed-row:first-child{border-top:0}
.fixed-row .mid{flex:1;min-width:150px}
.pill{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--income) 16%,transparent);color:var(--income)}
.pill.pend{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}

/* modal */
dialog{border:0;border-radius:18px;padding:0;width:min(460px,calc(100% - 24px));background:var(--surface);color:var(--ink);max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
dialog .mfoot{position:sticky;bottom:0;background:var(--surface);padding-top:12px;z-index:1}
dialog::backdrop{background:rgba(10,20,16,.45)}
.mhead{padding:18px 20px 0;font-weight:800;font-size:1.1rem}
.mbody{padding:14px 20px;display:grid;gap:12px}
.mfoot{padding:0 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mfoot .spacer{flex:1}
label.f{display:grid;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
label.f input,label.f select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-weight:500;font-size:1rem;width:100%}
.big input{font-size:1.6rem!important;font-weight:800!important}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:8px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.scrollx{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:24px;box-sizing:border-box}
.login .card{width:min(380px,100%);display:grid;gap:12px;border-color:transparent;box-shadow:none;border-radius:20px;box-sizing:border-box}
.login h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.02em}
.login .err{color:var(--warn);font-size:.9rem;min-height:1.2em}
.login .err.ok{color:var(--income)}
.linkbtn{border:0;background:transparent;color:var(--brand);font-weight:600;cursor:pointer;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.update-bar{position:fixed;left:12px;right:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:460px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;box-shadow:0 6px 18px rgba(0,0,0,.2);font-size:.92rem;font-weight:600}
.update-bar span{flex:1;white-space:nowrap}
.update-bar button{border:0;border-radius:10px;min-height:44px;cursor:pointer;font-weight:700}
.update-bar .go{background:var(--brand);color:var(--brand-ink);padding:0 16px}
.update-bar .x{background:transparent;color:inherit;min-width:44px;font-size:1.2rem;opacity:.7}
.rowbtns{display:flex;gap:6px}
.fixed-row.compact{flex-wrap:nowrap}
.fixed-row.compact .mid{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tokbox{display:block;word-break:break-all;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.85rem;user-select:all}
.testn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.testn input,.testn select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:1rem;width:100%}
a{color:var(--brand)}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.pendbtn{margin-left:auto;border:0;border-radius:999px;background:var(--warn);color:#fff;font-weight:700;min-height:40px;padding:0 14px;cursor:pointer}
.pendbtn b{display:inline-block;min-width:20px;margin-left:4px;background:rgba(255,255,255,.25);border-radius:999px;padding:1px 6px}
.quick{display:flex;gap:8px}
.btn.inc{background:var(--income);color:var(--on-income)}
.btn.spend{background:var(--spend);color:var(--on-spend)}
.seg button[data-type="gasto"][aria-pressed="true"]{background:var(--spend);color:var(--on-spend)}
.seg button[data-type="ingreso"][aria-pressed="true"]{background:var(--income);color:var(--on-income)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.themes button{display:grid;gap:8px;text-align:left;border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;min-height:44px}
.themes button[aria-pressed="true"]{border-color:var(--ink)}
.themes .chips{display:flex;gap:4px}
.themes .chips i{width:22px;height:22px;border-radius:7px;display:block}
.themes b{font-size:.92rem}
.expect{margin-top:16px}
.strip.two{margin:0 0 10px;height:22px}
.strip i.todo,.sw.todo{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--spend) 45%,transparent) 0 5px,color-mix(in srgb,var(--spend) 18%,transparent) 5px 10px)}
.after{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.92rem}
.suggest{padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.9rem;margin-bottom:6px}
.suggest details{margin-top:6px}
.suggest summary{cursor:pointer;color:var(--brand);font-weight:600;min-height:32px;display:flex;align-items:center}
.cash{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.ftotals{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0 6px}
.ftotals div{display:flex;flex-direction:column}
.ftotals b{font-size:1.15rem}
.fgroup{margin-top:14px}
.fghead{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:4px;border-bottom:1px solid var(--line)}
.amt.retiro{color:var(--muted)} .amt.ahorro{color:var(--brand)}
.inline-new{display:flex;gap:8px;flex-wrap:wrap;margin-top:-4px}
.inline-new input{flex:1 1 160px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:1rem}
.warnbox{border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem}
.fijobox{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:12px}
.check input{width:22px;height:22px}

const txDb = t => {
  const row = { id:t.id, type:t.type, amount:t.amount, category_id:t.categoryId || null, date:t.date, note:t.note || "", fixed_id:t.fixedId || null, payment_method_id:t.methodId || null, recurrence_id:t.recurrenceId || null, due_date:t.dueDate || null, goal_id:t.goalId || null };
  // Columnas de la migración 003: solo se mandan si el movimiento las usa (así la app funciona aunque falte la migración).

const recDb = r => ({ ...(S.hasGroups ? { group_id: r.type === "gasto" ? r.groupId || null : null } : {}), id:r.id, name:r.name, type:r.type, amount:r.amount, original_amount:r.original ?? r.amount, category_id:r.categoryId || null, payment_method_id:r.methodId || null, freq:r.freq, start_date:r.start, day:usesDay(r.freq) ? (r.day || +r.start.slice(8)) : null, mode:r.mode, next_date:r.next || null, active:r.active });

function rangeFor(ym) { return [ymAdd(ym, -5) + "-01", ym + "-" + pad(daysIn(ym))]; }
const missingTable = e => e && (e.code === "42P01" || e.code === "PGRST205" || e.code === "42703" || /does not exist|could not find/i.test(e.message || ""));

async function check(p, okMsg) {
  const { error } = await p;
  if (error) { console.error(error); toast(navigator.onLine ? "No se pudo guardar: " + error.message : "Sin conexión. Intenta de nuevo cuando tengas señal."); setSync("off", "Error al guardar"); return false; }
  if (okMsg) toast(okMsg);
  return true;
}

let lastGen = 0;
async function loadBase() {
  if (Date.now() - lastGen > 5 * 60e3) { lastGen = Date.now(); await sb.rpc("generate_pending_entries"); } // crea pendientes de fijos cuya fecha ya llegó
  const [a] = rangeFor(S.ym);
  const [st, cs, pm, rc, pe, gl, sv, pf, tk, sp, ins, fd, wc, eg, pd] = await Promise.all([
    sb.from("settings").select("*").maybeSingle(),
    sb.from("categories").select("*").order("created_at"),
    sb.from("payment_methods").select("*").order("created_at"),
    sb.from("recurrences").select("*").order("created_at"),
    sb.from("pending_entries").select("*").neq("status", "aceptado").order("date").limit(5000), // incluye descartados viejos: así no se vuelven "vencidos"
    sb.from("goals").select("*").order("created_at"),
    sb.from("transactions").select("*").in("type", ["ahorro","sacar","rendimiento"]).order("date").limit(10000),
    sb.from("profiles").select("role,display_name").eq("user_id", userId).maybeSingle(),
    sb.from("api_tokens").select("id,name,last_used_at,revoked,created_at").order("created_at"),
    sb.from("savings_places").select("*").order("created_at"),
    sb.from("instruments").select("*"),
    sb.from("transactions").select("date").order("date").limit(1),
    sb.from("webauthn_credentials").select("id,device,created_at,last_used_at").order("created_at"),
    sb.from("expense_groups").select("*").order("created_at"),
    sb.from("transactions").select("recurrence_id,due_date").not("recurrence_id", "is", null).limit(20000), // pagos de fijos de cualquier fecha (para los vencidos)
  ]);
  if (cs.error) throw cs.error;
  S.needsMigration = [pm, rc, pe, gl, sv].some(r => missingTable(r.error)) ? "001_metodos_fijos_pendientes_metas.sql"
    : [pf, tk].some(r => missingTable(r.error)) ? "002_notificaciones_usuarios_siri_gmail.sql"
    : [sp, ins].some(r => missingTable(r.error)) ? "003_apartados_inversiones.sql"
    : (cs.data || []).length && !("parent_id" in cs.data[0]) ? "004_bimestral_subcategorias.sql"
    : missingTable(wc.error) ? "005_semestral_anual_avisos_faceid.sql"
    : missingTable(eg.error) ? "008_grupos_y_topes.sql" : "";
  S.hasGroups = !eg.error;
  S.groups = (eg.data || []).map(toGroup);
  if (!pd.error) S.paidDue = (pd.data || []).map(r => r.recurrence_id + "|" + r.due_date);
  S.has005 = !wc.error;
  S.passkeys = wc.data || [];
  S.displayName = st.data?.display_name || "";
  try { if (S.displayName) localStorage.setItem("finanzas.name", S.displayName); } catch {}
  S.hasSubcats = !(cs.data || []).length || "parent_id" in cs.data[0];
  const err = [pm, rc, pe, gl, sv, pf, tk, sp, ins].find(r => r.error && !missingTable(r.error));
  if (err) throw err.error;
  S.currency = st.data?.currency || "MXN";
  S.notify = st.data?.notify || {};
  S.profile = pf.data || null;
  S.tokens = tk.data || [];
  S.categories = (cs.data || []).map(toCat);
  S.methods = (pm.data || []).map(toMethod);
  S.recs = (rc.data || []).map(toRec);
  S.pending = (pe.data || []).map(toPend);
  S.goals = (gl.data || []).map(toGoal);
  S.aptx = (sv.data || []).map(toTx);
  S.places = (sp.data || []).map(toPlace);
  S.instruments = (ins.data || []).map(toInstrument);
  S.firstYm = fd.data?.[0] ? ymOf(fd.data[0].date) : null;
  if (!S.categories.length) {
    const rows = DEFAULT_CATS.map(([name, kind, color], i) => ({ id: uid(), name, kind, color, budget: 0, created_at: new Date(Date.now() + i).toISOString() }));
    const { error } = await sb.from("categories").insert(rows);
    if (!error) S.categories = rows.map(toCat);
  }
  if (!S.methods.length && !/^001/.test(S.needsMigration)) {
    const rows = DEFAULT_METHODS.map(([name, kind, color], i) => ({ id: uid(), name, kind, color, active: true, created_at: new Date(Date.now() + i).toISOString() }));
    const { error } = await sb.from("payment_methods").insert(rows);
    if (!error) S.methods = rows.map(toMethod);
  }
}
async function loadTx() {
  const [a, b] = rangeFor(S.ym), want = S.ym;
  const { data, error } = await sb.from("transactions").select("*").gte("date", a).lte("date", b).order("date", { ascending:false }).limit(5000);
  if (error) throw error;
  if (want !== S.ym) return; // month changed meanwhile
  S.tx = data.map(toTx);
}
// Lo último que se descargó se guarda en el teléfono para mostrarlo si no hay conexión.
const CACHE_KEYS = ["displayName","has005","hasGroups","groups","paidDue","currency","notify","profile","tokens","categories","methods","recs","pending","goals","aptx","places","instruments","firstYm","tx","ym","hasSubcats","needsMigration"];
const cacheKey = () => "finanzas.cache." + userId;
function saveCache() { try { const o = { at: Date.now() }; for (const k of CACHE_KEYS) o[k] = S[k]; localStorage.setItem(cacheKey(), JSON.stringify(o)); } catch {} }
function loadCache() {
  try { const o = JSON.parse(localStorage.getItem(cacheKey()) || "null"); if (!o) return false; for (const k of CACHE_KEYS) if (k in o) S[k] = o[k]; S.cacheAt = o.at; return true; } catch { return false; }
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
let retryT;
async function refresh(all = true) {
  if (!S.ready && !S.offline) { S.loadError = ""; render(); }
  try {
    await withTimeout((async () => { if (all) await loadBase(); await loadTx(); })(), 15000);
    S.ready = true; S.offline = false; S.loadError = ""; S.cacheAt = Date.now();
    if (S.tab === "movs" && S.mv.key) loadMovs("soft", S.mv.items.length); else S.mv.key = null; // al volver a Movimientos se recarga
    if (S.tab === "fdetail" && S.recId) loadRecTx(S.recId);
    clearInterval(retryT); retryT = null;
    setSync("on", "Sincronizado");
    if (all) saveCache();
  } catch (e) {
    console.error(e);
    const net = !navigator.onLine || e.message === "timeout" || /fetch|network|load failed/i.test(e.message || "");
    setSync("off", net ? "Sin conexión" : "Error al cargar");
    if (S.ready || loadCache()) { S.ready = true; S.offline = true; }
    else S.loadError = net ? "No hay conexión a internet o la señal es muy débil." : "No se pudo conectar con tus datos. " + (e.message || "");
    if (!retryT) retryT = setInterval(() => navigator.onLine && refresh(true), 20000); // reintenta solo cada 20 s
  }
  render();
}
let refreshT;
const refreshSoon = () => { clearTimeout(refreshT); refreshT = setTimeout(() => refresh(true), 300); };

function startRealtime() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("finanzas-" + userId);
  ["transactions","categories","settings","payment_methods","recurrences","pending_entries","goals","api_tokens","savings_places","expense_groups"].forEach(table =>
    channel.on("postgres_changes", { event:"*", schema:"public", table, filter:`user_id=eq.${userId}` }, refreshSoon));
  channel.subscribe();
}

const Store = {

  savePlace: (p, msg) => check(sb.from("savings_places").upsert({ id:p.id, name:p.name, kind:p.kind, color:p.color, rate:p.rate || 0, rate_updated_at:p.rateUpdated || null, active:p.active }), msg).then(ok => (ok && refresh(), ok)),
  delPlace: (id, msg) => check(sb.from("savings_places").delete().eq("id", id), msg).then(ok => (ok && refresh(), ok)),
  delTx: (id, msg) => check(sb.from("transactions").delete().eq("id", id), msg).then(ok => (ok && refresh(), ok)),
  saveRec: (r, msg) => check(sb.from("recurrences").upsert(recDb(r)), msg).then(ok => (ok && refresh(), ok)),
  delRec: async (id, msg) => {
    await sb.from("pending_entries").delete().eq("recurrence_id", id).eq("status", "pendiente");
    return check(sb.from("recurrences").delete().eq("id", id), msg).then(ok => (ok && refresh(), ok));
  },
  saveCat: (c, msg) => check(sb.from("categories").upsert({ id:c.id, name:c.name, kind:c.kind, color:c.color, budget:c.budget || 0, ...(S.hasSubcats ? { parent_id:c.parentId || null } : {}) }), msg).then(ok => (ok && refresh(), ok)),
  delCat: (id, msg) => check(sb.from("categories").delete().eq("id", id), msg).then(ok => (ok && refresh(), ok)),
  delMethod: (id, msg) => check(sb.from("payment_methods").delete().eq("id", id), msg).then(ok => (ok && refresh(), ok)),
  saveMethod: (m, msg) => check(sb.from("payment_methods").upsert({ id:m.id, name:m.name, kind:m.kind, color:m.color, active:m.active }), msg).then(ok => (ok && refresh(), ok)),
  saveGoal: (g, msg) => check(sb.from("goals").upsert({ id:g.id, name:g.name, target_amount:g.target, target_date:g.targetDate || null, color:g.color, active:g.active }), msg).then(ok => (ok && refresh(), ok)),
  delGoal: (id, msg) => check(sb.from("goals").delete().eq("id", id), msg).then(ok => (ok && refresh(), ok)),
  saveCurrency: cur => { S.currency = cur; render(); return check(sb.from("settings").upsert({ user_id:userId, currency:cur }), "Moneda guardada"); },
  // Acepta un pendiente: crea el movimiento y, si cambió el monto de un fijo, lo guarda como sugerencia para la próxima vez.
  acceptPending: async (p, vals, msg = "Movimiento registrado") => {
    const t = { id: uid(), type: vals.type, amount: vals.amount, categoryId: vals.categoryId, methodId: vals.methodId, groupId: vals.groupId !== undefined ? vals.groupId : pendGroup(p), date: vals.date, note: vals.note, recurrenceId: p.recurrenceId, dueDate: p.recurrenceId ? p.date : null };
    if (!await check(sb.from("transactions").insert(txDb(t)))) return false;
    await check(sb.from("pending_entries").update({ status: "aceptado" }).eq("id", p.id));
    const r = S.recs.find(x => x.id === p.recurrenceId);
    if (r && r.amount !== t.amount) await check(sb.from("recurrences").update({ amount: t.amount }).eq("id", r.id));
    rememberMethod(t.methodId);
    toast(msg); refresh(); if (S.tab === "pdetail") navBack(); return true;
  },
  acceptMany: async list => {
    const rows = list.map(p => txDb({ id: uid(), type: p.type, amount: p.amount, categoryId: p.categoryId, methodId: p.methodId, groupId: pendGroup(p), date: p.date, note: p.note, recurrenceId: p.recurrenceId, dueDate: p.recurrenceId ? p.date : null }));
    if (!await check(sb.from("transactions").insert(rows))) return;
    await check(sb.from("pending_entries").update({ status: "aceptado" }).in("id", list.map(p => p.id)));
    toast(`${rows.length} movimientos confirmados`); go("resumen", {}, "back");
  },
  // Confirmar con un toque: registra con los datos que ya tiene; "Deshacer" lo revierte por unos segundos.
  quickConfirm: async p => {
    const t = { id: uid(), type: p.type, amount: p.amount, categoryId: p.categoryId, methodId: p.methodId, groupId: pendGroup(p), date: p.date, note: p.note, recurrenceId: p.recurrenceId, dueDate: p.recurrenceId ? p.date : null };
    if (!await check(sb.from("transactions").insert(txDb(t)))) return;
    await check(sb.from("pending_entries").update({ status: "aceptado" }).eq("id", p.id));
    if (S.tab === "pdetail") navBack();
    refresh();
    toastUndo(`Confirmado: ${p.note || cat(p.categoryId).name} ${fmt(p.amount)}`, async () => {
      await check(sb.from("transactions").delete().eq("id", t.id));
      await check(sb.from("pending_entries").update({ status: "pendiente" }).eq("id", p.id), "Se deshizo");
      refresh();
    });
  },
  discardPending: p => check(sb.from("pending_entries").update({ status: "descartado" }).eq("id", p.id), "Pendiente descartado").then(ok => (ok && refresh(), ok)),
  // Registra el pago de una fecha programada de un fijo (sin pendiente).
  payOccurrence: (r, due, msg, vals = {}) => {
    const today = todayISO(), date = vals.date || (due > today && ymOf(due) === ymOf(today) ? today : due);
    const methodId = vals.methodId !== undefined ? vals.methodId : r.methodId;
    rememberMethod(methodId);
    S.paidDue = [...S.paidDue, r.id + "|" + due];
    return Store.saveTx({ id: uid(), type: r.type, amount: vals.amount || r.amount, categoryId: r.categoryId, methodId, groupId: r.groupId, date, note: r.name, recurrenceId: r.id, dueDate: due }, msg || `${r.name} registrado`);
  },
  saveGroup: (g, msg) => check(sb.from("expense_groups").upsert({ id:g.id, name:g.name, color:g.color, cap:g.cap || 0 }), msg).then(ok => (ok && refresh(), ok)),
  delGroup: (id, msg) => check(sb.from("expense_groups").delete().eq("id", id), msg).then(ok => (ok && refresh(), ok)),
};

function showLogin(msg = "") {
  $("#app").hidden = true; $("#fab").hidden = true; $("#login").hidden = false;
  $("#installRow").hidden = isStandalone(); $("#installTitle").textContent = isIOS() ? "Agregar como app en tu iPhone" : isAndroid() ? "Agregar como app en tu teléfono" : "Agregar como app en tu iPhone";
  $("#loginErr").textContent = msg;
  updateLoginBio();

async function onSession(session) {
  if (!session) { userId = null; return showLogin(); }
  if (userId === session.user.id) return;
  userId = session.user.id; S.email = session.user.email || "";
  S.accountName = (session.user.user_metadata?.full_name || "").trim();
  try { localStorage.setItem(LAST_KEY, JSON.stringify({ email: S.email, name: S.accountName.split(/\s+/)[0] || "" })); } catch {}
  const fresh = welcomeNext || Date.now() - lastActive() >= 30 * 60e3; // al entrar o tras 30 min sin usarla: abre en el mes en curso
  if (welcomeNext) Object.assign(S, { tab: "resumen", ym: ymOf(todayISO()), setPage: null, apPlace: null, pendId: null }); // al iniciar sesión, siempre al Resumen
  if (welcomeNext) { welcomeNext = false; try { localStorage.setItem(ACT_KEY, String(Date.now())); } catch {} showWelcome(); }
  else if (checkIdle()) return; // la sesión guardada ya expiró por inactividad
  if (!S.ready && loadCache()) S.ready = true; // muestra lo último guardado mientras llega lo nuevo
  if (fresh) S.ym = ymOf(todayISO());
  $("#login").hidden = true; $("#app").hidden = false; $("#fab").hidden = false;
  render();
  await refresh(true);
  startRealtime();
  refreshPushState().then(render).catch(() => {});
}
async function doAuth(signup) {
  const email = $("#email").value.trim(), password = $("#password").value;
  if (!email || password.length < 6) { $("#loginErr").textContent = "Escribe tu correo y una contraseña de al menos 6 caracteres."; return; }
  $("#loginErr").textContent = "";
  const btns = document.querySelectorAll("#login button"); btns.forEach(b => b.disabled = true);
  if (!signup) { welcomeNext = true; S.offerBio = true; }
  const { data, error } = signup ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  btns.forEach(b => b.disabled = false);
  if (error) {
    welcomeNext = false; S.offerBio = false;
    const m = error.message || "";
    $("#loginErr").textContent = /Invalid login/i.test(m) ? "Correo o contraseña incorrectos." : /not confirmed/i.test(m) ? "Confirma tu correo primero (revisa tu bandeja)." : /not allowed|disabled/i.test(m) ? "El registro de cuentas nuevas está desactivado." : m;
    return;
  }
  if (signup && !data.session) $("#loginErr").textContent = "Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.";
}

// ---------- contraseña ----------
// Envía el correo de recuperación. El enlace regresa a esta misma página (debe estar en Supabase → Authentication → URL Configuration).
async function forgotPassword() {
  const email = $("#email").value.trim(), err = $("#loginErr");
  err.classList.remove("ok");
  if (!email) { err.textContent = "Escribe tu correo arriba y vuelve a tocar \"¿Olvidaste tu contraseña?\"."; $("#email").focus(); return; }
  $("#forgot").disabled = true;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  $("#forgot").disabled = false;
  if (error) { err.textContent = /rate|seconds|too many/i.test(error.message) ? "Ya enviamos un correo hace poco. Espera un momento antes de pedir otro." : "No se pudo enviar el correo: " + error.message; return; }
  err.classList.add("ok");
  err.textContent = "Listo. Si ese correo tiene cuenta, te llegará un enlace para crear una contraseña nueva. Revisa también tu carpeta de spam.";
}
// Pide la contraseña nueva (después de abrir el enlace del correo, o desde Ajustes → Cuenta).
function openNewPassword(fromEmail) {
  openDialog(`
    <div class="mhead">${fromEmail ? "Crea tu nueva contraseña" : "Cambiar contraseña"}</div>
    <div class="mbody">
      ${fromEmail ? `<div class="sub">Abriste el enlace de recuperación. Escribe tu contraseña nueva.</div>` : ""}
      <label class="f">Contraseña nueva<input name="p1" type="password" autocomplete="new-password" minlength="6"></label>
      <label class="f">Repítela<input name="p2" type="password" autocomplete="new-password" minlength="6"></label>
      <div class="sub" data-err style="color:var(--warn)"></div>
    </div>
    <div class="mfoot"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button type="button" class="btn" data-save>Guardar contraseña</button></div>`,
  f => {
    const e = f.querySelector("[data-err]");
    f.querySelector("[data-close]").onclick = close;
    f.querySelector("[data-save]").onclick = async () => {
      if (f.p1.value.length < 6) { e.textContent = "Usa al menos 6 caracteres."; f.p1.focus(); return; }
      if (f.p1.value !== f.p2.value) { e.textContent = "Las dos contraseñas no coinciden."; f.p2.focus(); return; }
      const b = f.querySelector("[data-save]"); b.disabled = true;
      const { error } = await sb.auth.updateUser({ password: f.p1.value });
      b.disabled = false;
      // Supabase rechaza repetir la contraseña actual; para el usuario eso no es un error: ya es su contraseña.
      const same = error && (error.code === "same_password" || /different|same/i.test(error.message));

const toB64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const pkCall = async body => {
  const { data, error } = await sb.functions.invoke("passkeys", { body });

const credJSON = (cred, extra) => ({ id: cred.id, rawId: toB64u(cred.rawId), type: cred.type, clientExtensionResults: cred.getClientExtensionResults?.() || {}, authenticatorAttachment: cred.authenticatorAttachment || undefined, response: extra(cred.response) });

  const { options: o, challengeId } = await pkCall({ action: "register-options" });

  const response = credJSON(cred, r => ({ clientDataJSON: toB64u(r.clientDataJSON), attestationObject: toB64u(r.attestationObject), transports: r.getTransports?.() || [] }));
  await pkCall({ action: "register-verify", challengeId, response, device: isIOS() ? "iPhone" : "Android" });
  try { localStorage.setItem(PK_KEY, JSON.stringify({ id: cred.id, email: S.email, at: Date.now() })); } catch {}
}
async function loginWithPasskey() {
  const { options: o, challengeId } = await pkCall({ action: "login-options" });
  const cred = await navigator.credentials.get({ publicKey: { ...o, challenge: b64u(o.challenge), allowCredentials: (o.allowCredentials || []).map(c => ({ ...c, id: b64u(c.id) })) } });
  const response = credJSON(cred, r => ({ clientDataJSON: toB64u(r.clientDataJSON), authenticatorData: toB64u(r.authenticatorData), signature: toB64u(r.signature), userHandle: r.userHandle ? toB64u(r.userHandle) : undefined }));
  const { token_hash } = await pkCall({ action: "login-verify", challengeId, response });
  welcomeNext = true;

// Por defecto: 5 minutos en el celular (volver a entrar es con Face ID/huella) y 15 en el navegador. Se cambia en Ajustes → Cuenta.

const lastActive = () => +lsGet(ACT_KEY) || Date.now();
let lastMark = 0;
const markActive = () => {
  const n = Date.now(); if (n - lastMark < 4000) return; lastMark = n;
  try { localStorage.setItem(ACT_KEY, String(n)); } catch {}
  $("#idleBar").hidden = true;
};
["pointerdown", "keydown", "touchstart", "wheel"].forEach(ev => document.addEventListener(ev, markActive, { passive: true }));

  if (!userId) return false;

  return false;
}

// ---------- derived data ----------

function monthPlan(ym = S.ym) {

// ---------- apartados: saldos estimados ----------
const fxSymbol = cur => cur === "USD" ? "MXN=X" : `${cur}MXN=X`;

// Precio en pesos de un instrumento (convierte con el tipo de cambio si cotiza en otra moneda).
function priceMxn(sym) {

// Saldo estimado de un lugar: lo que no está en un instrumento crece con su tasa anual (interés diario);
// lo invertido en un instrumento vale títulos × precio actual. Los ajustes a saldo real entran como "rendimiento".
function placeStats(p) {
  const today = todayISO(), r = (p.rate || 0) / 100;

// 4. ¿En qué se fue? Selector Categorías · Grupos · Métodos; los 5 principales con barra y "Ver todo".

  let rows = [], foot = "";

      .concat(cats.filter(x => !S.categories.some(c => c.id === x.c.id)))
      .filter(r => r.v || r.c.budget).sort((a, b) => b.v - a.v)
      .map(({ c, v, subs }) => {

          ? `<details class="srow"><summary>${body}</summary><div class="subrows">${subs.map(x => `<div class="subrow num"><span>${esc(x.c.name)}</span><b>${fmt(x.v)}</b></div>`).join("")}</div></details>`

function recStatus(r, over, paid) {
  const inc = r.type === "ingreso", today = todayISO();
  if (!r.active) return { kind: "next", text: "Pausado" };
  const late = over.filter(it => it.r.id === r.id).map(it => it.date)
    .concat(S.pending.filter(p => p.status === "pendiente" && p.recurrenceId === r.id && p.date < today).map(p => p.date)).sort();
  if (late.length) return { kind: "late", text: late.length > 1 ? `${late.length} pendientes · ${shortDate(late[0])}` : `Pendiente · era el ${shortDate(late[0])}` };
  const nxt = occOnOrAfter(r, today), nxtPaid = paid.has(r.id + "|" + nxt);
  let last = null; for (let d = occOnOrAfter(r, isoAdd(today, -400)), n = 0; d < today && n < 500; d = occOnOrAfter(r, isoAdd(d, 1)), n++) last = d;
  const hasPend = S.pending.some(p => p.status === "pendiente" && p.recurrenceId === r.id && p.date === nxt);
  if (nxt === today && !nxtPaid) return { kind: "next", text: hasPend ? "Por confirmar · hoy" : `${inc ? "Por recibir" : "Por pagar"} · hoy` };
  if (nxtPaid) { const after = occOnOrAfter(r, isoAdd(nxt, 1)); return { kind: "ok", text: `${inc ? "Recibido" : "Pagado"} ✓ · sigue ${shortDate(after)}` }; }
  if (last && last >= recFrom(r) && paid.has(r.id + "|" + last)) return { kind: "ok", text: `${inc ? "Recibido" : "Pagado"} ✓ · sigue ${shortDate(nxt)}` };
  return { kind: "next", text: `${inc ? "Por recibir" : "Por pagar"} · ${shortDate(nxt)}` };

const amountField = (label, val) => `<label class="f big">${label}<span class="money"><span class="cur">$</span><span class="mwrap"><span class="mirror" aria-hidden="true"></span><input name="amount" type="text" inputmode="decimal" autocomplete="off" value="${esc(val === "" || val == null ? "" : +val % 1 ? (+val).toFixed(2) : String(+val))}"></span></span></label>`;
// Formato de dinero mientras se escribe: comas de miles, máximo 2 decimales y los centavos faltantes en gris.
function moneyFormat(raw) {
  const s = String(raw).replace(/[^\d.]/g, ""), i = s.indexOf(".");
  let int = (i < 0 ? s : s.slice(0, i)).replace(/^0+(?=\d)/, "").slice(0, 10);
  const dec = i < 0 ? null : s.slice(i + 1).replace(/\./g, "").slice(0, 2);
  if (!int && dec !== null) int = "0";
  const text = (int ? int.replace(/\B(?=(\d{3})+(?!\d))/g, ",") : "") + (dec === null ? "" : "." + dec);
  const hint = !int ? "0.00" : dec === null ? ".00" : "0".repeat(2 - dec.length);
  return { text, hint };
}
function moneyInit(input) {
  const mirror = input.parentNode.querySelector(".mirror");
  const paint = () => { const { text, hint } = moneyFormat(input.value); mirror.innerHTML = `<span>${esc(text)}</span><span class="hint">${hint}</span>`; };
  const reformat = () => {
    const pos = input.selectionStart ?? input.value.length, sig = input.value.slice(0, pos).replace(/[^\d.]/g, "").length;
    const { text } = moneyFormat(input.value);
    input.value = text;
    let n = 0, c = 0; while (c < text.length && n < sig) { if (/[\d.]/.test(text[c])) n++; c++; }
    try { input.setSelectionRange(c, c); } catch {}
    paint();
  };
  // Si el teclado escribe coma como decimal, se toma como punto.
  input.addEventListener("beforeinput", e => { if (e.data === ",") { e.preventDefault(); input.setRangeText(".", input.selectionStart, input.selectionEnd, "end"); reformat(); } });
  input.addEventListener("input", reformat);
  input.value = moneyFormat(input.value).text; paint();
}

// "+ Agregar categoría/método nuevo" dentro de un select: muestra un campo para crearlo ahí mismo y lo deja seleccionado.
function inlineNew(f, sel, kind) {
  let prev = sel.value === NEW ? "" : sel.value;
  sel.addEventListener("change", () => {
    if (sel.value !== NEW) { prev = sel.value; return; }
    const box = document.createElement("div");
    box.className = "inline-new";
    box.innerHTML = `<input type="text" maxlength="40" placeholder="${kind === "method" ? "Ej. BBVA Crédito" : kind === "group" ? "Ej. Innecesarios" : kind === "place" ? "Ej. Nu, CETES, GBM" : sel.name === "subId" ? "Ej. Internet" : "Ej. Colegiatura"}" aria-label="Nombre"><button type="button" class="btn sm">Crear</button><button type="button" class="btn ghost sm">Cancelar</button>`;
    sel.closest("label").after(box);
    sel.disabled = true;
    const [inp, ok, no] = box.children;
    const done = () => { box.remove(); sel.disabled = false; };
    no.onclick = () => { sel.value = prev; done(); };
    ok.onclick = async () => {
      const name = inp.value.trim(); if (!name) { inp.focus(); return; }
      ok.disabled = true;
      const id = uid(), k = typeof kind === "function" ? kind() : kind;
      if (k && typeof k === "object") { // subcategoría nueva dentro de la categoría elegida
        const parent = cat(k.parent), c = { id, name, kind: parent.kind, color: parent.color, budget: 0, parentId: parent.id };
        if (!await Store.saveCat(c, "Subcategoría agregada")) { ok.disabled = false; return; }
        if (!S.categories.some(x => x.id === id)) S.categories.push(c);
        sel.innerHTML = subOptions(parent.id, id); sel.value = id; prev = id; done(); return;
      }
      if (k === "group") {
        const g = { id, name, color: PALETTE[(S.groups.length + 4) % PALETTE.length], cap: 0 };
        if (!await Store.saveGroup(g, "Grupo agregado")) { ok.disabled = false; return; }
        if (!S.groups.some(x => x.id === id)) S.groups.push(g);
        sel.innerHTML = groupOptions(id);
      } else if (k === "place") {
        const p = { id, name, kind: guessPlaceKind(name), color: PALETTE[(S.places.length + 2) % PALETTE.length], rate: 0, active: true };
        if (!await Store.savePlace(p, `Lugar agregado (${KIND_AP[p.kind]})`)) { ok.disabled = false; return; }
        if (!S.places.some(x => x.id === id)) S.places.push(p);
        sel.innerHTML = placeOptions(id);
      } else if (k === "method") {
        const m = { id, name, kind: guessMethodKind(name), color: PALETTE[S.methods.length % PALETTE.length], active: true };
        if (!await Store.saveMethod(m, "Método agregado")) { ok.disabled = false; return; }
        if (!S.methods.some(x => x.id === id)) S.methods.push(m);
        sel.innerHTML = methodOptions(id);
      } else {
        const c = { id, name, kind: k, color: PALETTE[S.categories.length % PALETTE.length], budget: 0 };
        if (!await Store.saveCat(c, "Categoría agregada")) { ok.disabled = false; return; }
        if (!S.categories.some(x => x.id === id)) S.categories.push(c);
        sel.innerHTML = catOptions(k, id);
      }
      sel.value = id; prev = id; done(); sel.dispatchEvent(new Event("change"));
    };
    setTimeout(() => inp.focus(), 30);
  });
}

    };

    const recOf = () => S.recs.find(r => r.id === f.existRec?.value);
    const fillRecs = () => { if (!f.existRec) return; const cur = f.existRec.value; f.existRec.innerHTML = `<option value="">No, es un fijo nuevo</option>` + S.recs.filter(r => r.type === type && r.active).map(r => `<option value="${esc(r.id)}" ${r.id === cur ? "selected" : ""}>${esc(r.name)} · ${esc(freqText(r))}</option>`).join(""); syncRec(); };
    // Fecha programada que cubre el pago: la más cercana a la fecha elegida que no esté pagada (dentro de un periodo).
    const WINDOW = { diario: 1, semanal: 7, quincenal: 15, salario: 16, mensual: 31, bimestral: 62, semestral: 183, anual: 366 };
    const isPaid = (r, d) => S.tx.some(x => x.recurrenceId === r.id && x.dueDate === d);
    let curOcc = null;
    // Para pagos anteriores a la primera fecha del fijo, el calendario se extiende hacia atrás con la misma regla.
    const backStart = (r, before) => {
      if (r.start <= before) return r.start;
      if (r.freq === "semanal" || r.freq === "quincenal" || r.freq === "diario") { const st = r.freq === "semanal" ? 7 : r.freq === "quincenal" ? 15 : 1; return isoAdd(r.start, -st * Math.ceil(isoDiff(r.start, before) / st)); }
      const st = MONTH_STEP[r.freq] || 1, months = Math.ceil((Math.ceil(isoDiff(r.start, before) / 28) + 2) / st) * st, m = ymAdd(ymOf(r.start), -months);
      return `${m}-${pad(Math.min(r.day || +r.start.slice(8), daysIn(m)))}`;
    };
    const pickOcc = (r0, date) => {
      const w = WINDOW[r0.freq] || 31, all = [], r = { ...r0, start: backStart(r0, isoAdd(date, -w)) };
      for (let d = occOnOrAfter(r, isoAdd(date, -w)); d <= isoAdd(date, w) && all.length < 80; d = occOnOrAfter(r, isoAdd(d, 1))) all.push(d);
      all.sort((a, b) => Math.abs(isoDiff(a, date)) - Math.abs(isoDiff(b, date)) || a.localeCompare(b));
      return { nearest: all[0] || null, occ: all.find(d => !isPaid(r, d)) || null };
    };
    const syncShift = () => {
      const r = recOf(), occ = curOcc, date = f.date.value;
      const diff = r && occ && date && occ !== date;
      f.querySelector("[data-salnote]").hidden = !(r && r.freq === "salario" && diff);
      f.querySelector("[data-shiftbox]").hidden = !(diff && r.freq !== "salario");
      if (diff) f.querySelector("[data-shiftq]").innerHTML = `Pagaste el <b>${dShort(date)}</b> y estaba programado el <b>${dShort(occ)}</b>. ¿Cambiar las próximas fechas?`;
    };
    const syncRec = () => {
      const r = recOf(); if (!f.existRec) return;
      f.querySelector("[data-newrec]").hidden = !!r; f.querySelector("[data-oldrec]").hidden = !r;
      if (!r) { curOcc = null; return; }
      const date = f.date.value || todayISO(), { nearest, occ } = pickOcc(r, date), info = f.querySelector("[data-occinfo]");
      curOcc = occ;
      info.innerHTML = !occ ? `No hay una fecha programada sin pagar cerca; se registrará con su propia fecha (${dayName(date)}).`
        : nearest && nearest !== occ ? `El pago del <b>${dayName(nearest)}</b> ya está registrado; este se tomará como el del <b>${dayName(occ)}</b>.`
        : `Se registrará como el pago del <b>${dayName(occ)}</b>.`;
      syncShift();
    };
    f.existRec?.addEventListener("change", () => {
      const r = recOf();
      if (r) { // llena con los datos del fijo (el monto se puede cambiar)
        f.categoryId.innerHTML = catOptions(type, r.categoryId); picker.sync(cat(r.categoryId).parentId ? r.categoryId : "");
        if (r.methodId) f.methodId.value = r.methodId;
        if (f.groupId && r.groupId && group(r.groupId)) f.groupId.value = r.groupId;
        if (!parseAmount(f.amount.value)) { f.amount.value = String(r.amount); f.amount.dispatchEvent(new Event("input")); }
        if (!f.note.value) f.note.value = r.name;
      }
      syncRec();
    });
    f.date.addEventListener("input", syncRec); // el iPhone avisa con "input" al mover la fecha
    f.date.addEventListener("change", syncRec);
    let picker = null;
    apply();
    picker = bindSub(f, t.categoryId);
    inlineNew(f, f.categoryId, () => type);
    f.categoryId.addEventListener("change", () => { if (f.categoryId.value !== NEW) setFreq(); });
    inlineNew(f, f.methodId, "method");
    if (f.groupId) inlineNew(f, f.groupId, "group");
    inlineNew(f, f.placeId, "place");
    f.placeId.addEventListener("change", setInst);
    f.querySelectorAll("[data-type]").forEach(b => b.onclick = () => {
      type = b.dataset.type === "apartado" ? apMode : b.dataset.type;
      f.querySelectorAll("[data-type]").forEach(x => x.setAttribute("aria-pressed", x === b));
      apply();
    });
    f.querySelectorAll("[data-ap]").forEach(b => b.onclick = () => {
      apMode = type = b.dataset.ap;
      f.querySelectorAll("[data-ap]").forEach(x => x.setAttribute("aria-pressed", x === b));
      apply();
    });
    // Buscador de instrumentos (Yahoo Finanzas, mediante la función "precios").
    const results = f.querySelector("[data-iresults]");
    const search = async () => {
      const q = f.instq.value.trim(); if (!q) return;
      results.innerHTML = `<div class="sub">Buscando…</div>`;
      const { data, error } = await sb.functions.invoke("precios", { body: { action: "search", q } });
      if (error) { results.innerHTML = `<div class="sub">No se pudo buscar. Revisa que la función "precios" esté instalada en Supabase.</div>`; return; }
      results.innerHTML = (data.results || []).map(r => `<button type="button" class="ires" data-sym="${esc(r.symbol)}"><b>${esc(r.symbol)}</b> <span class="sub">${esc(r.name)} · ${esc(r.type)} · ${esc(r.exchange)}</span></button>`).join("") || `<div class="sub">Sin resultados.</div>`;
    };
    f.querySelector("[data-isearch]").onclick = search;
    f.instq.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); search(); } });
    f.instq.addEventListener("input", () => { sym = ""; });
    results.addEventListener("click", e => { const b = e.target.closest("[data-sym]"); if (!b) return; sym = b.dataset.sym; f.instq.value = sym; results.innerHTML = `<div class="sub">Elegiste <b>${esc(sym)}</b>.</div>`; });
    f.isFixed?.addEventListener("change", () => { f.querySelector("[data-fijo]").hidden = !f.isFixed.checked; setFreq(); fillRecs(); });
    f.querySelector("[data-close]").onclick = close;
    f.querySelector("[data-del]")?.addEventListener("click", () => { if (confirm("¿Eliminar este movimiento?")) { close(); Store.delTx(t.id, "Movimiento eliminado"); } });
    f.querySelector("[data-save]").onclick = async () => {
      const amount = parseAmount(f.amount.value), rt = realType(), ap = rt === "ahorro" || rt === "sacar";
      if (!(amount > 0)) { f.amount.focus(); toast("Escribe un monto mayor que cero"); return; }
      if (!f.date.value) { f.date.focus(); return; }
      if ((rt === "gasto" || rt === "ingreso") && (!f.categoryId.value || f.categoryId.value === NEW)) { toast("Elige una categoría"); return; }
      if (f.subId?.value === NEW) { toast("Termina de crear la subcategoría o elige otra"); return; }
      if (rt === "gasto" && f.groupId?.value === NEW) { toast("Termina de crear el grupo o elige otro"); return; }
      if (ap && (!f.placeId.value || f.placeId.value === NEW) && (isNew || t.placeId)) { toast("Elige dónde está el dinero"); return; }
      const methodId = f.methodId.value === NEW ? "" : f.methodId.value;
      const rec = { ...t, type: rt, amount: Math.round(amount*100)/100, groupId: rt === "gasto" ? groupVal(f) : null, categoryId: rt === "gasto" || rt === "ingreso" ? picker.value() : null, goalId: ap ? f.goalId.value || null : null, methodId, date: f.date.value, note: f.note.value.trim() };
      if (ap || t.placeId !== undefined) rec.placeId = ap ? f.placeId.value || null : null;

        if (ok) {

        const r = { id: uid(), name: rec.note || cat(rec.categoryId).name, type: rt, amount: rec.amount, original: rec.amount, categoryId: rec.categoryId, methodId, groupId: rec.groupId, freq: f.freq.value, start: rec.date, day: +rec.date.slice(8), mode: f.mode.value, active: true };

      await Store.saveTx(rec, msg);
      if (rec.recurrenceId || ap) refresh();
    };
    setTimeout(() => f.amount.focus(), 50);

}

// Eliminar categoría: si tiene movimientos o fijos, muestra cuáles y pide a qué categoría moverlos.
async function deleteCat(c) {
  if (!c.parentId && topCats(c.kind).length <= 1) { toast("Debe quedar al menos una categoría"); return; }
  const subs = subsOf(c.id);
  const { data, count, error } = await sb.from("transactions").select("id,type,amount,date,note", { count:"exact" }).eq("category_id", c.id).order("date", { ascending:false }).limit(8);
  if (error) { toast("No se pudo revisar la categoría: " + error.message); return; }
  const recs = S.recs.filter(r => r.categoryId === c.id), pends = pendingOpen().filter(p => p.categoryId === c.id);
  if (!count && !recs.length && !pends.length && !subs.length) {
    if (confirm(`¿Eliminar "${c.name}"? No tiene movimientos registrados.`)) { close(); Store.delCat(c.id, c.parentId ? "Subcategoría eliminada" : "Categoría eliminada"); }
    return;
  }
  const others = catsOf(c.kind).filter(x => x.id !== c.id && x.parentId !== c.id);
  const fallback = (c.parentId && cat(c.parentId)) || others.find(x => /^otros/i.test(x.name)) || others[0];
  openDialog(`
    <div class="mhead">Eliminar "${esc(c.name)}"</div>
    <div class="mbody">
      <div class="warnbox">${count || recs.length || pends.length ? "Hay movimientos registrados en esta categoría. " : ""}Elige a dónde moverlos antes de eliminarla; no se borrará ningún movimiento.</div>
      ${recs.map(r => `<div class="sub">• Tienes un ${r.type === "ingreso" ? "ingreso" : "gasto"} fijo de <b>${esc(r.name)}</b> de <b class="num">${fmt(r.amount)}</b> (${esc(freqText(r).toLowerCase())}).</div>`).join("")}
      ${count ? `<div><div class="sub" style="font-weight:700;margin-bottom:4px">${count} movimiento${count > 1 ? "s" : ""}:</div>${data.map(t => `<div class="sub num">• ${dShort(t.date)}/${t.date.slice(0,4)} · ${esc(t.note || c.name)} · ${fmt(+t.amount)}</div>`).join("")}${count > data.length ? `<div class="sub">… y ${count - data.length} más.</div>` : ""}</div>` : ""}
      ${pends.length ? `<div class="sub">• ${pends.length} pendiente${pends.length > 1 ? "s" : ""} por confirmar.</div>` : ""}
      ${subs.length ? `<div class="sub">• Subcategorías: <b>${subs.map(x => esc(x.name)).join(", ")}</b>. Pasan a la categoría que elijas (o quedan como categorías si eliges una subcategoría).</div>` : ""}
      <label class="f">¿A dónde los quieres mover?<select name="target">${allCatOptions(c.kind, fallback?.id, c.id)}<option value="${NEW}">+ Agregar categoría nueva</option></select></label>
    </div>
    <div class="mfoot"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button type="button" class="btn danger" data-save>Mover y eliminar</button></div>`,
  f => {
    inlineNew(f, f.target, c.kind);
    f.querySelector("[data-close]").onclick = close;
    f.querySelector("[data-save]").onclick = async () => {
      const to = f.target.value;
      if (!to || to === NEW || to === c.id) { toast("Elige la categoría destino"); return; }
      close();
      if (await check(sb.rpc("reassign_and_delete_category", { p_old: c.id, p_new: to }), `Movido a "${cat(to).name}" y categoría eliminada`)) refresh();
    };
  });
}

// AJ/AM. Pago o ingreso fijo fuera de fecha: confirmar, ajustar monto y método, y elegir con qué fecha se registra.
function openPayDue(it) {
  const r = it.r, pe = it.pe, type = pe ? pe.type : r.type, inc = type === "ingreso", due = it.date;
  const name = pe ? (pe.note || cat(pe.categoryId).name) : r.name, verb = inc ? "recibido" : "pagado";
  openDialog(`
    <div class="mhead">${inc ? "Ingreso" : "Pago"} fuera de fecha</div>
    <div class="mbody">
      <div class="warnbox">¿Seguro que quieres marcar como ${verb} este movimiento fuera de fecha?</div>
      <div><b>${esc(name)}</b><div class="sub">Estaba programado el ${esc(dayName(due))}${due.slice(0, 4) !== todayISO().slice(0, 4) ? " de " + due.slice(0, 4) : ""}.</div></div>
      ${amountField("Monto", pe ? pe.amount : r.amount)}
      <label class="f">${inc ? "Recibido en" : "Método de pago"}<select name="methodId">${methodOptions(pe ? pe.methodId : r.methodId)}</select></label>
    </div>
    <div class="mfoot paydue">
      <button type="button" class="btn ${inc ? "inc" : "spend"}" data-save data-when="due">Con la fecha programada (${shortDate(due)})</button>
      <button type="button" class="btn ghost" data-save data-when="today">Con la fecha de hoy (${shortDate(todayISO())})</button>
      <button type="button" class="btn ghost" data-close>Cancelar</button>
    </div>`,
  f => {
    inlineNew(f, f.methodId, "method");
    f.querySelector("[data-close]").onclick = close;
    f.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
      const amount = parseAmount(f.amount.value);
      if (!(amount > 0)) { f.amount.focus(); toast("Escribe un monto mayor que cero"); return; }
      const date = b.dataset.when === "today" ? todayISO() : due, methodId = f.methodId.value === NEW ? "" : f.methodId.value, amt = Math.round(amount * 100) / 100;
      close();
      const msg = `${name}: registrado como ${verb}`;
      if (pe) await Store.acceptPending(pe, { type, amount: amt, categoryId: pe.categoryId, methodId, date, note: pe.note }, msg);
      else await Store.payOccurrence(r, due, msg, { amount: amt, methodId, date });
    });
  });
}

function openRealBalance(p) {
  const st = placeStats(p);
  openDialog(`
    <div class="mhead">Actualizar saldo real</div>
    <div class="mbody">
      <div class="sub">Escribe cuánto tienes hoy en <b>${esc(p.name)}</b> según su app. Saldo estimado: <b class="num">${fmt(st.value)}</b>.</div>

      <div class="sub">La diferencia se registra como rendimiento (o pérdida) y el estimado vuelve a partir de este saldo.</div>

  f => {
    f.querySelector("[data-close]").onclick = close;
    f.querySelector("[data-save]").onclick = async () => {
      const real = parseAmount(f.amount.value);
      if (!(real >= 0)) { f.amount.focus(); toast("Escribe el saldo"); return; }
      const diff = Math.round((real - st.value) * 100) / 100;
      close();
      if (Math.abs(diff) < 0.01) { toast("El saldo ya coincide"); return; }
      await Store.saveTx({ id: uid(), type: "rendimiento", amount: diff, placeId: p.id, date: todayISO(), note: "Ajuste a saldo real" }, `Saldo actualizado (${signed(diff)})`);
      refresh();
    };
    setTimeout(() => f.amount.focus(), 50);
  });
}

const blockIfOffline = e => { if (!isOffline()) return false; e.preventDefault(); e.stopPropagation(); toast(OFFLINE_MSG); return true; };
// Botones de formularios que guardan o borran: se avisa y el formulario se queda abierto (no se pierde lo escrito).
form.addEventListener("click", e => { if (e.target.closest("[data-save],[data-del],[data-discard],.inline-new .btn:not(.ghost)")) blockIfOffline(e); }, true);
// Acciones de las pantallas que guardan o borran directamente.
const WRITE_ACTIONS = "[data-delgroup],[data-delpk],[data-quickconfirm],[data-payocc],[data-discard],[data-delcat],[data-delmethod],[data-revtok],[data-deltok],[data-setrole],#tnGo,#newTok,#pushOn,#pushOff,#invite,[data-act=confirm-all],[data-act=prices]";
$("#view").addEventListener("click", e => { if (e.target.closest(WRITE_ACTIONS)) blockIfOffline(e); }, true);
$("#view").addEventListener("change", e => { if (e.target.matches("#cur,[data-notify]") && blockIfOffline(e)) render(); }, true);
$("#fab").onclick = () => { if (isOffline()) { toast(OFFLINE_MSG); return; } openTx(null, S.tab === "apartados" ? { type: "ahorro" } : {}); };
$("#hBack").onclick = () => navBack();
$("#hAct").onclick = () => { const r = S.recs.find(x => x.id === S.recId); if (r) openRec(r); };
$("#view").addEventListener("click", e => {
  const t = e.target.closest("[data-fijo],[data-fijostab],[data-mftype],[data-mfclear],[data-spendtab],[data-filtergroup],[data-editgroup],[data-delgroup],[data-quickconfirm],[data-pdetail],[data-discard],[data-edit],[data-payocc],[data-openpend],[data-editrec],[data-editcat],[data-delcat],[data-newcat],[data-newsub],[data-editmethod],[data-delmethod],[data-editgoal],[data-place],[data-editplace],[data-realbal],[data-setpage],[data-back],[data-act]");
  if (!t) return;
  const d = t.dataset;
  if (d.fijo) go("fdetail", { recId: d.fijo }, "fwd");
  else if (d.fijostab) { S.fijosTab = d.fijostab; render(); }
  else if (d.mftype) { S.mf.type = d.mftype; loadMovs(true); }
  else if (d.mfclear) { Object.assign(S.mf, MF_CLEAR[d.mfclear]); loadMovs(true); }
  else if (d.spendtab) { lsSet(SPEND_KEY, d.spendtab); S.spendAll = false; render(); }
  else if (d.filtergroup) { Object.assign(S.mf, { type: "todos", sort: "recientes", group: d.filtergroup, cat: "", method: "", dates: "mes", from: "", to: "", fixed: false, q: "" }); go("movs"); }
  else if (d.editgroup) openGroup(group(d.editgroup));
  else if (d.delgroup) deleteGroup(group(d.delgroup));
  // Fijos vencidos: primero se confirma y se elige la fecha (programada u hoy).
  else if (d.quickconfirm) { const p = S.pending.find(x => x.id === d.quickconfirm); if (p) { if (p.recurrenceId && p.date < todayISO()) openPayDue({ r: S.recs.find(x => x.id === p.recurrenceId), date: p.date, pe: p }); else Store.quickConfirm(p); } }
  else if (d.pdetail) go("pdetail", { pendId: d.pdetail }, "fwd");
  else if (d.discard) { const p = S.pending.find(x => x.id === d.discard); if (p && confirm("¿Descartar este movimiento? No se registrará nada.")) { Store.discardPending(p); navBack(); } }
  else if (d.edit) openTx(S.tx.find(x => x.id === d.edit) || S.aptx.find(x => x.id === d.edit) || S.mv.items.find(x => x.id === d.edit) || Object.values(S.recTx || {}).flat().find(x => x.id === d.edit));
  else if (d.payocc) { const [id, due] = d.payocc.split("|"), r = S.recs.find(x => x.id === id); if (r) { if (due < todayISO()) openPayDue({ r, date: due }); else Store.payOccurrence(r, due); } }
  else if (d.openpend) { const p = S.pending.find(x => x.id === d.openpend); if (p) openPending(p); }
  else if (d.editrec) openRec(S.recs.find(x => x.id === d.editrec));
  else if (d.editcat) openCat(S.categories.find(x => x.id === d.editcat));
  else if (d.delcat) deleteCat(S.categories.find(x => x.id === d.delcat));
  else if (d.newcat) openCat(null, d.newcat);
  else if (d.newsub) openCat(null, cat(d.newsub).kind, d.newsub);
  else if (d.editmethod) openMethod(S.methods.find(x => x.id === d.editmethod));
  else if (d.delmethod) deleteMethod(S.methods.find(x => x.id === d.delmethod));
  else if (d.editgoal) openGoal(S.goals.find(x => x.id === d.editgoal));
  else if (d.place) go("apartados", { apPlace: d.place }, "fwd");
  else if (d.editplace) openPlace(place(d.editplace));
  else if (d.realbal) openRealBalance(place(d.realbal));
  else if (d.setpage) go("cats", { setPage: d.setpage, ...(d.setpage === "admin" ? { adminUsers: null } : {}) }, "fwd");
  else if (d.back) navBack();
  else if (d.act === "fijos") go("fijos", { fijosFrom: "resumen" }, "fwd");
  else if (d.act === "fijos-aj") go("fijos", { fijosFrom: "cats" }, "fwd");
  else if (d.act === "newrec") openRec();
  else if (d.act === "filters") openFilters();
  else if (d.act === "mvmore") { S.mv.auto = true; loadMore(); }
  else if (d.act === "howsug") { S.showSug = !S.showSug; render(); }
  else if (d.act === "apartar") { if (isOffline()) toast(OFFLINE_MSG); else openTx(null, { type: "ahorro" }); }
  else if (d.act === "pend") go("pend", {}, "fwd");
  else if (d.act === "confirm-all") { const l = pendingOpen(); if (l.length && confirm(`¿Confirmar los ${l.length} movimientos con los datos que tienen?`)) Store.acceptMany(l); }
  else if (d.act === "newmethod") openMethod();
  else if (d.act === "newgroup") openGroup();
  else if (d.act === "guide") openGuide("Ajustes");
  else if (d.act === "heroflip") { lsSet(HERO_KEY, lsGet(HERO_KEY) === "gastado" ? "libre" : "gastado"); render(); }
  else if (d.act === "closecard") { lsSet(CLOSE_KEY, ymAdd(ymOf(todayISO()), -1)); render(); }
  else if (d.act === "seeprev") { S.ym = ymAdd(ymOf(todayISO()), -1); render(); window.scrollTo(0, 0); refresh(false); }
  else if (d.act === "spendall") { S.spendAll = !S.spendAll; render(); }
  else if (d.act === "chartadv") { S.chartAdv = !S.chartAdv; render(); }
  else if (d.act === "allover") { S.allOver = !S.allOver; render(); }
  else if (d.act === "newgoal") openGoal();
  else if (d.act === "newplace") openPlace();
  else if (d.act === "prices") refreshPrices(true);
  else if (d.act === "retry") refresh(true);
});
dlg.addEventListener("click", e => { if (e.target === dlg) close(); });

// Gesto de regresar: arrastrar desde el borde izquierdo (como en las apps del iPhone).
// Solo con la app instalada; en Safari ya existe el gesto del navegador.
{
  const v = $("#view"); let sw = null, under = null;
  const reset = () => { v.style.transition = ""; v.style.transform = ""; v.style.boxShadow = ""; v.style.position = v.style.zIndex = ""; };
  document.addEventListener("touchstart", e => {
    if (!isStandalone() || !backTarget() || e.touches.length > 1 || dlg.open) return;
    const t = e.touches[0];
    if (t.clientX > 28) return;
    sw = { x: t.clientX, y: t.clientY, dx: 0, t: Date.now(), lock: null };
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!sw) return;
    const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    if (!sw.lock) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { sw.lock = "h"; under = peekParent(v); v.style.position = "relative"; v.style.zIndex = 1; }
      else if (Math.abs(dy) > 8) { sw = null; return; } else return;
    }
    e.preventDefault();
    sw.dx = Math.max(0, dx);
    v.style.transition = "none";
    v.style.transform = `translateX(${sw.dx}px)`;
    v.style.boxShadow = "-8px 0 24px rgba(0,0,0,.12)";
    if (under) { const w = v.offsetWidth, k = Math.min(1, sw.dx / w); under.style.transform = `translateX(${-w * .3 * (1 - k)}px)`; under.style.filter = `brightness(${.9 + .1 * k})`; }
  }, { passive: false });
  document.addEventListener("touchend", () => {
    if (!sw) return;
    const { dx, t } = sw, fast = dx > 40 && dx / (Date.now() - t) > .5, u = under;
    sw = null; under = null;
    if (dx > innerWidth * .35 || fast) {
      // Continúa desde donde quedó el dedo: la pantalla termina de salir y la anterior llega desde atrás.
      S.navFrom = dx; S.skipPop = !!history.state?.nav;
      goBack("back"); u?.remove(); // la pantalla real ya ocupa su lugar y termina la animación desde ahí
      if (S.skipPop) history.back();
    } else {
      v.style.transition = `transform .3s ${EASE}`;
      v.style.transform = "";
      if (u) { u.style.transition = `transform .3s ${EASE}, filter .3s`; u.style.transform = `translateX(${-v.offsetWidth * .3}px)`; u.style.filter = "brightness(.9)"; }
      setTimeout(() => { reset(); u?.remove(); }, 320);
    }
  });
  document.addEventListener("touchcancel", () => { if (sw) { sw = null; reset(); under?.remove(); under = null; } });
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMonthPicker(); });
$("#offBanner").addEventListener("click", e => { if (e.target.closest("[data-act=retry]")) { setSync("off", "Reintentando…"); refresh(true); } });
$("#signin").onclick = () => doAuth(false);
$("#installRow").onclick = () => openGuide("Iniciar sesión");
$("#signup").onclick = () => doAuth(true);
$("#password").addEventListener("keydown", e => { if (e.key === "Enter") doAuth(false); });
$("#forgot").onclick = forgotPassword;
$("#bioLogin").onclick = async () => {
  const b = $("#bioLogin"); b.disabled = true; $("#loginErr").textContent = "";
  try { await loginWithPasskey(); }
  catch (e) { $("#loginErr").textContent = e.name === "NotAllowedError" ? "Se canceló. Vuelve a intentarlo o entra con tu contraseña." : e.message; }
  b.disabled = false;
};
$("#idleStay").onclick = () => { lastMark = 0; markActive(); };
$("#showPw").onclick = () => { $("#pwBox").classList.remove("folded"); $("#showPw").hidden = true; setTimeout(() => $("#password").focus(), 50); };
$("#otherAcct").onclick = () => { try { localStorage.removeItem(LAST_KEY); } catch {} $("#email").value = ""; $("#password").value = ""; updateLoginBio(); $("#pwBox").classList.remove("folded"); $("#showPw").hidden = true; setTimeout(() => $("#email").focus(), 50); };
// AN. Al volver a la app tras 30 minutos o más, se muestra otra vez el mes en curso.
const BACK_TO_NOW = 30 * 60e3;
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { hiddenAt = Date.now(); return; }
  if (!userId || checkIdle()) return;
  if (hiddenAt && Date.now() - hiddenAt >= BACK_TO_NOW && S.ym !== ymOf(todayISO())) { S.ym = ymOf(todayISO()); render(); }
  refresh(true);
});
window.addEventListener("online", () => userId && refresh(true));
window.addEventListener("offline", () => { setSync("off", "Sin conexión"); if (S.ready) { S.offline = true; render(); } });

// ---------- start ----------
if ("serviceWorker" in navigator) swReg().catch(() => {}); // guarda la app para abrirla sin conexión y recibe notificaciones
if (!sb) {
  // Sin la librería de Supabase (normalmente porque no hubo internet al abrir): avisar y dejar reintentar.
  const offline = typeof supabase === "undefined";
  $("#login").hidden = false;
  $("#login .card").innerHTML = offline
    ? `<h1>Mis finanzas</h1><div class="sub">No hay conexión a internet o la señal es muy débil. Revisa tu conexión e inténtalo de nuevo.</div><button class="btn" id="reloadApp" style="min-height:44px">Reintentar</button>`
    : `<h1>Mis finanzas</h1><div class="err">Falta configurar config.js con los datos de tu proyecto de Supabase.</div>`;
  $("#reloadApp")?.addEventListener("click", () => location.reload());
  if (offline) window.addEventListener("online", () => location.reload());
  return;
}
// ---------- actualizaciones ----------
const fetchRemoteVersion = async () => {
  const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return (await r.json()).version;
};
const reloadFresh = () => location.replace("./?v=" + Date.now());
let dismissedVersion = null;
const checkForUpdate = async () => {
  try {
    const v = await fetchRemoteVersion();
    if (v && v !== APP_VERSION && v !== dismissedVersion) { $("#updateBar").dataset.v = v; $("#updateBar").hidden = false; }
  } catch (e) { /* sin conexión: se reintenta al volver a la app */ }
};
$("#updateGo").onclick = reloadFresh;
$("#updateX").onclick = () => { dismissedVersion = $("#updateBar").dataset.v; $("#updateBar").hidden = true; };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });
checkForUpdate();

if (pushSupported()) {
  if (Notification.permission === "granted") navigator.serviceWorker.ready.then(() => refreshPushState()).then(render).catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => {
    if (e.data?.type !== "open") return;
    const t = new URL(e.data.url).searchParams.get("tab");
    if (t === "usuarios") Object.assign(S, { tab: "cats", setPage: "admin", adminUsers: null });
    else if (t) S.tab = t;
    if (t) { render(); window.scrollTo(0, 0); }
    refresh();
  });
}
sb.auth.getSession().then(({ data }) => onSession(data.session));
sb.auth.onAuthStateChange((event, session) => { setTimeout(() => {
  if (!session) { userId = null; showLogin(); return; }
  onSession(session);
  if (event === "PASSWORD_RECOVERY") openNewPassword(true);
}, 0); });
})();

</script>
